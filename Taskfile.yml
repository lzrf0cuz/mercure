# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
# Install: brew install go-task
# Usage: task <taskname> or task --list
#
# Mercure Hub (lzrf0cuz fork) — SSE notification streaming.
# Dev loop, image build and compose lifecycle. Images are built and tagged locally.
#
# Caddyfile Configurations bundled in the image:
#   - local.Caddyfile: Local development (direct TLS)
#   - Caddyfile:       Production (direct TLS, no fronting load balancer)
#
# Override examples:
#   task up CADDYFILE=Caddyfile ENV_FILE=.env.prod

version: '3'

output: prefixed
method: checksum
silent: true
dotenv: ['.env.local', '.env.dev']

vars:
  # Application
  SVC_NAME: mercure
  SVC_VERSION: v0.1.0
  UPSTREAM_VERSION: v1.0.2
  # Upstream branch this fork is rebased onto.
  UPSTREAM_LINE: main
  # In-tree redistransport module version. Independent from SVC_VERSION
  # because the transport is its own Go module with its own release
  # cadence. Bumped via `task version:bump:rt:*`.
  RT_VERSION: v0.1.0
  # vX.Y.Z[-suffix] tag form for version:set, version:set:rt and release:*.
  # The leading `v` is required by the Go module proxy. Not strict SemVer;
  # the release tasks also require V to match SVC_VERSION / RT_VERSION.
  TAG_VERSION_REGEX: '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'
  # For shell arguments only. `dir:` fields spell out caddy/{{.SVC_NAME}}:
  # go-task resolves a relative `dir:` built from this var against the wrong base.
  CADDY_DIR: caddy/{{.SVC_NAME}}

  # Go
  GO_OS:
    sh: go env GOOS 2>/dev/null || echo "darwin"
  GO_ARCH:
    sh: go env GOARCH 2>/dev/null || echo "amd64"
  GO_BUILD_TAGS: nobadger,nomysql,nopgx
  # Prebuilt grafana/dashboard-linter release that `task setup` installs.
  DASHBOARD_LINTER_VERSION: 0.1.1
  # `mercure.version` / `mercure.upstreamVersion` feed the mercure_version_info metric.
  # `redistransport.version` stamps the Redis transport, which caddy/mercure/main.go links in.
  GO_LDFLAGS: >-
    -X 'github.com/caddyserver/caddy/v2.CustomVersion=Mercure {{.SVC_VERSION}} (upstream {{.UPSTREAM_VERSION}}) Caddy'
    -X 'github.com/caddyserver/caddy/v2.CustomBinaryName=mercure'
    -X 'github.com/dunglas/mercure.version={{.SVC_VERSION}}'
    -X 'github.com/dunglas/mercure.upstreamVersion={{.UPSTREAM_VERSION}}'
    -X 'github.com/caddyserver/caddy/v2/modules/caddyhttp.ServerHeader=Mercure {{.SVC_VERSION}} (upstream {{.UPSTREAM_VERSION}})'
    -X 'github.com/lzrf0cuz/mercure/redistransport.version={{.RT_VERSION}}'
  BIN_DIR: bin/{{.SVC_VERSION}}

  # Docker: locally tagged images only.
  DOCKER_OS: linux
  # Pinned to specific patch tags so `task up:build` is reproducible across
  # workstations; bump in lock-step with caddy/go.mod for BASE_IMAGE.
  BUILD_IMAGE: golang:1.27.1-alpine
  BASE_IMAGE: caddy:2.11.4-alpine
  IMAGE_TAG: "{{.SVC_VERSION}}-{{.DOCKER_OS}}-{{.GO_ARCH}}"
  IMAGE_REPO: "{{.SVC_NAME}}"
  SVC_IMAGE: "{{.IMAGE_REPO}}:{{.IMAGE_TAG}}"

  # Observability image pins, exported in env: below for compose.observability.yaml.
  PROMETHEUS_IMAGE: prom/prometheus:v3.11.3
  GRAFANA_IMAGE: grafana/grafana:12.4.3
  JAEGER_IMAGE: jaegertracing/all-in-one:1.62.0

  # Container
  CONTAINER_NAME: mercure
  # Caddyfile: local.Caddyfile (local dev) or Caddyfile (prod direct)
  CADDYFILE: local.Caddyfile
  # Env file: .env.dev (local) or .env.prod (production). `task env:init` creates the dev files from the .env.dev*.example files;
  # copy .env.prod.example to .env.prod by hand and fill it in.
  ENV_FILE: .env.dev

  # URLs
  MERCURE_UI: https://localhost/.well-known/mercure/debug/
  MERCURE_HTTP_UI: http://localhost/.well-known/mercure/debug/
  METRICS_URL: http://localhost:9091/metrics
  PROMETHEUS_URL: http://localhost:9090
  GRAFANA_URL: http://localhost:3000
  REDISINSIGHT_URL: http://localhost:5540
  JAEGER_URL: http://localhost:16686

env:
  # Docker Compose environment
  SVC_BUILD_IMAGE: "{{.BUILD_IMAGE}}"
  SVC_BASE_IMAGE: "{{.BASE_IMAGE}}"
  SVC_IMAGE: "{{.SVC_IMAGE}}"
  SVC_VERSION: "{{.SVC_VERSION}}"
  UPSTREAM_VERSION: "{{.UPSTREAM_VERSION}}"
  RT_VERSION: "{{.RT_VERSION}}"
  PLATFORM: "{{.DOCKER_OS}}/{{.GO_ARCH}}"
  CADDYFILE: "{{.CADDYFILE}}"
  ENV_FILE: "{{.ENV_FILE}}"
  # Observability image pins → compose.observability.yaml references these.
  PROMETHEUS_IMAGE: "{{.PROMETHEUS_IMAGE}}"
  GRAFANA_IMAGE: "{{.GRAFANA_IMAGE}}"
  JAEGER_IMAGE: "{{.JAEGER_IMAGE}}"

# Redistransport tasks, reachable from the root as rt:* (e.g. `task rt:test`,
# `task rt:redis:up`). Define them in redistransport/Taskfile.yml only.
includes:
  rt:
    taskfile: ./redistransport/Taskfile.yml
    dir: ./redistransport
    optional: true

tasks:
  # ============================================
  # Default
  # ============================================
  default:
    cmds:
      - task --list

  # ============================================
  # Development (quick start, local workflow)
  # ============================================
  dev:
    desc: Start Mercure in dev mode with log following
    cmds:
      - task: up:detach
      - sleep 2
      - task: logs

  open:
    desc: Open Mercure debug UI in browser (HTTPS)
    cmds:
      - open {{.MERCURE_UI}}

  open:http:
    desc: Open Mercure debug UI in browser (HTTP)
    cmds:
      - open {{.MERCURE_HTTP_UI}}

  open:grafana:
    desc: Open Grafana home in browser (run `task up` or `task rt:metrics:up:redis` first)
    cmds:
      - open {{.GRAFANA_URL}}

  open:prometheus:
    desc: Open Prometheus UI in browser (run `task up` or `task rt:metrics:up:redis` first)
    cmds:
      - open {{.PROMETHEUS_URL}}

  open:jaeger:
    desc: Open Jaeger UI in browser (run `task dev:full:tracing` for the Redis loop, or `task tracing:up` for the root hub stack, first)
    cmds:
      - open {{.JAEGER_URL}}

  open:dashboard:hub:
    desc: Open the Mercure Hub Grafana dashboard directly
    cmds:
      - open {{.GRAFANA_URL}}/d/mercure-hub

  open:dashboard:transport:
    desc: Open the Mercure Redis Transport Grafana dashboard directly
    cmds:
      - open {{.GRAFANA_URL}}/d/mercure-redis-transport

  open:dashboard:
    desc: Open both Grafana dashboards (hub + transport) in new tabs
    cmds:
      - task: open:dashboard:hub
      - task: open:dashboard:transport

  open:dev:
    desc: Open Mercure debug UI + RedisInsight tabs (run `task dev:redis` first)
    cmds:
      - open {{.MERCURE_UI}}
      - open {{.REDISINSIGHT_URL}}

  open:dev:full:
    # dev:full and tracing:up run separate compose stacks that share container
    # names and port 3000, so run one at a time. This task assumes the rt
    # observability stack (dev:full); use open:jaeger when tracing:up is the one up.
    desc: Mercure + RedisInsight + rt Grafana — run `task dev:full` first (rt observability stack)
    cmds:
      - open {{.MERCURE_UI}}
      - open {{.REDISINSIGHT_URL}}
      - open {{.GRAFANA_URL}}

  tls:trust:
    desc: Install Caddy root certificate (local binary)
    vars:
      CERT_PATH: $HOME/Library/Application Support/Caddy/pki/authorities/local/root.crt
      HASH_FILE: $HOME/.caddy-trust-local-sha1
      OTHER_HASH_FILE: $HOME/.caddy-trust-docker-sha1
      KEYCHAIN: ~/Library/Keychains/login.keychain-db
    preconditions:
      - sh: test -f "$HOME/Library/Application Support/Caddy/pki/authorities/local/root.crt"
        msg: "Caddy root CA not found. Run 'task go:run' at least once to generate it."
    cmds:
      - |
        set -eu
        NEW_HASH=$(openssl x509 -in "{{.CERT_PATH}}" -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':')
        if [ -f "{{.HASH_FILE}}" ] && [ "$(cat "{{.HASH_FILE}}")" = "$NEW_HASH" ]; then
          echo "[tls:trust] Certificate unchanged, skipping keychain update."
          exit 0
        fi
        # Remove old cert if tracked
        if [ -f "{{.HASH_FILE}}" ]; then
          security delete-certificate -Z "$(cat "{{.HASH_FILE}}")" -t {{.KEYCHAIN}} 2>/dev/null || true
        elif security find-certificate -c "Caddy Local Authority" {{.KEYCHAIN}} >/dev/null 2>&1; then
          TOTAL=$(security find-certificate -a -c "Caddy Local Authority" -Z {{.KEYCHAIN}} | grep -c "SHA-1" || echo 0)
          TRACKED=0
          [ -f "{{.OTHER_HASH_FILE}}" ] && TRACKED=1
          if [ "$TOTAL" -gt "$TRACKED" ]; then
            echo "ERROR: Found $TOTAL Caddy cert(s) in keychain but only $TRACKED tracked by sibling task."
            echo "No tracking file at {{.HASH_FILE}}."
            echo "Delete orphaned Caddy certs in Keychain Access, then re-run."
            exit 1
          fi
        fi
        # Add new cert and record its hash ONLY if the add succeeds — so a
        # headless / locked-keychain failure (no GUI auth) doesn't leave a
        # tracking file claiming a cert is trusted when it isn't.
        if security add-trusted-cert -r trustRoot -k {{.KEYCHAIN}} "{{.CERT_PATH}}"; then
          echo "$NEW_HASH" > "{{.HASH_FILE}}"
          echo "[tls:trust] Done. Local Caddy root CA is now trusted in login keychain."
        else
          echo "[tls:trust] Could not add trust setting (headless or locked keychain?). Run from a GUI session if needed."
        fi

  tls:trust:docker:
    desc: Trust the Docker container's Caddy root certificate
    vars:
      HASH_FILE: $HOME/.caddy-trust-docker-sha1
      OTHER_HASH_FILE: $HOME/.caddy-trust-local-sha1
      KEYCHAIN: ~/Library/Keychains/login.keychain-db
    preconditions:
      - sh: docker inspect mercure > /dev/null 2>&1
        msg: "Mercure container not running. Start with: task up:detach"
    cmds:
      # Clear any stale copy from a prior run so a failed docker cp can't leave
      # the next block trusting/hashing an old cert.
      - rm -f /tmp/mercure-docker-root.crt
      - docker cp mercure:/data/caddy/pki/authorities/local/root.crt /tmp/mercure-docker-root.crt
      - |
        set -eu
        NEW_HASH=$(openssl x509 -in /tmp/mercure-docker-root.crt -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':')
        if [ -f "{{.HASH_FILE}}" ] && [ "$(cat "{{.HASH_FILE}}")" = "$NEW_HASH" ]; then
          echo "[tls:trust:docker] Certificate unchanged, skipping keychain update."
          rm /tmp/mercure-docker-root.crt
          exit 0
        fi
        # Remove old cert if tracked
        if [ -f "{{.HASH_FILE}}" ]; then
          security delete-certificate -Z "$(cat "{{.HASH_FILE}}")" -t {{.KEYCHAIN}} 2>/dev/null || true
        elif security find-certificate -c "Caddy Local Authority" {{.KEYCHAIN}} >/dev/null 2>&1; then
          TOTAL=$(security find-certificate -a -c "Caddy Local Authority" -Z {{.KEYCHAIN}} | grep -c "SHA-1" || echo 0)
          TRACKED=0
          [ -f "{{.OTHER_HASH_FILE}}" ] && TRACKED=1
          if [ "$TOTAL" -gt "$TRACKED" ]; then
            echo "ERROR: Found $TOTAL Caddy cert(s) in keychain but only $TRACKED tracked by sibling task."
            echo "No tracking file at {{.HASH_FILE}}."
            echo "Delete orphaned Caddy certs in Keychain Access, then re-run."
            rm /tmp/mercure-docker-root.crt
            exit 1
          fi
        fi
        # Add new cert and record its hash ONLY if the add succeeds (see tls:trust).
        if security add-trusted-cert -r trustRoot -k {{.KEYCHAIN}} /tmp/mercure-docker-root.crt; then
          echo "$NEW_HASH" > "{{.HASH_FILE}}"
          echo "[tls:trust:docker] Done. Docker Caddy root CA is now trusted in login keychain."
        else
          echo "[tls:trust:docker] Could not add trust setting (headless or locked keychain?). Run from a GUI session if needed."
        fi
        rm -f /tmp/mercure-docker-root.crt

  setup:
    desc: Install the developer toolchain (brew bundle on macOS, a tool list elsewhere), dashboard-linter and ui/ npm deps, and create the local .env files
    cmds:
      - |
        if [ "$(uname -s)" = Darwin ] && command -v brew >/dev/null; then
          brew bundle --file=Brewfile
        else
          cat <<'EOT'
        Install these tools with your package manager (macOS: brew bundle --file=Brewfile):
          go 1.27+       https://go.dev/dl
          task           https://taskfile.dev/installation
          golangci-lint  https://golangci-lint.run/welcome/install
          govulncheck    go install golang.org/x/vuln/cmd/govulncheck@latest
          rumdl          cargo install rumdl (other methods: https://github.com/rvben/rumdl)
          shellcheck     https://github.com/koalaman/shellcheck#installing
          shfmt          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          node and npm   https://nodejs.org
          biome          npm install -g @biomejs/biome
        EOT
        fi
      # No formula exists, and `go install` of the module is broken by a
      # replace directive in its go.mod, so fetch the prebuilt release.
      - |
        if command -v dashboard-linter >/dev/null; then
          echo "dashboard-linter already installed"
        else
          command -v go >/dev/null || { echo "go not found: install it first (see above)" >&2; exit 1; }
          mkdir -p "$(go env GOPATH)/bin"
          curl --fail -sSL \
            "https://github.com/grafana/dashboard-linter/releases/download/v{{.DASHBOARD_LINTER_VERSION}}/dashboard-linter_{{.DASHBOARD_LINTER_VERSION}}_$(uname -s | tr A-Z a-z)_$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/').tar.gz" \
            | tar -xz -C "$(go env GOPATH)/bin" dashboard-linter
          echo "dashboard-linter installed in $(go env GOPATH)/bin; put it on PATH"
        fi
      - task: ui:deps
      - task: env:init

  env:init:
    desc: Create the local dev .env files from the committed .env.dev*.example files (never overwrites)
    cmds:
      - |
        for example in .env.dev*.example; do
          [ -e "$example" ] || continue
          target="${example%.example}"
          if [ -e "$target" ]; then
            echo "$target exists, left unchanged"
          else
            cp "$example" "$target"
            echo "created $target from $example"
          fi
        done

  # dotenv: skips a missing file without a word, so tasks that read an env
  # file depend on this check. FILE defaults to ENV_FILE.
  _check:env:
    internal: true
    preconditions:
      - sh: test -f {{.FILE | default .ENV_FILE}}
        msg: '{{if hasPrefix ".env.dev" (.FILE | default .ENV_FILE)}}{{.FILE | default .ENV_FILE}} missing: run `task setup` (or `task env:init`) to create it from {{.FILE | default .ENV_FILE}}.example{{else}}{{.FILE | default .ENV_FILE}} missing: copy {{.FILE | default .ENV_FILE}}.example to {{.FILE | default .ENV_FILE}} and fill it in{{end}}'
    cmds:
      - "true"

  doctor:
    desc: System health check — Docker, the task ci toolchain, env files, module deps, TLS cert
    cmds:
      - |
        ok=0
        fail=0
        # $1 = label, $2 = test command, $3 = fix instruction.
        # Captures stderr so failed checks surface the real reason
        # (e.g. proxy/auth errors from `go mod download`) instead of
        # silently dropping the diagnostic.
        check() {
            local err
            if err=$(eval "$2" 2>&1 >/dev/null); then
                printf "  PASS %s\n" "$1"
                ok=$((ok+1))
            else
                printf "  FAIL %s\n      → %s\n" "$1" "$3"
                if [ -n "$err" ]; then
                    while IFS= read -r line; do
                        printf "        %s\n" "$line"
                    done <<<"$err"
                fi
                fail=$((fail+1))
            fi
        }
        printf "\nmercure doctor\n==============\n\n"
        check "Docker daemon"                "docker info"                            "start the Docker daemon"
        check "Go toolchain"                 "command -v go"                          "install Go 1.27+ from https://go.dev/dl"
        check "golangci-lint"                "command -v golangci-lint"               "run task setup"
        check "govulncheck"                  "command -v govulncheck"                 "run task setup"
        check "rumdl"                        "command -v rumdl"                       "run task setup"
        check "shellcheck"                   "command -v shellcheck"                  "run task setup"
        check "shfmt"                        "command -v shfmt"                       "run task setup"
        check "node and npm"                 "command -v node && command -v npm"      "run task setup"
        check "biome"                        "command -v biome"                       "run task setup"
        check "dashboard-linter"             "command -v dashboard-linter"            "run task setup"
        check ".env.dev present"             "test -f .env.dev"                       "run task env:init"
        check ".env.dev.redis present"       "test -f .env.dev.redis"                 "run task env:init"
        check "hub go.sum present"           "test -s go.sum"                         "go mod download"
        check "caddy/ go.sum present"        "test -s caddy/go.sum"                   "(cd caddy && go mod download)"
        check "redistransport/ go.sum"       "test -s redistransport/go.sum"          "(cd redistransport && go mod download)"
        check "redistransport/caddy/ go.sum" "test -s redistransport/caddy/go.sum"    "(cd redistransport/caddy && go mod download)"
        check "Caddy local cert trusted"     'test -f "$HOME/.caddy-trust-local-sha1"'  "task go:run (or task dev) once to generate the cert, then task tls:trust"
        printf "\n  %d ok, %d fail\n\n" "$ok" "$fail"
        [ "$fail" -eq 0 ]

  # ============================================
  # Go (source, build, test)
  # ============================================
  go:run:
    desc: Run Mercure locally (reloads local.Caddyfile on change; restart for Go edits)
    dir: caddy/{{.SVC_NAME}}
    dotenv: ['../../.env.dev']
    deps: [{ task: _check:env, vars: { FILE: .env.dev } }]
    cmds:
      - mkdir -p data
      - go run -ldflags="{{.GO_LDFLAGS}}" -tags={{.GO_BUILD_TAGS}} -race . run -w -c ../../local.Caddyfile

  go:fmt:
    # `golangci-lint fmt` uses the formatters and exclusions in .golangci.yml,
    # so it agrees with go:lint. It ignores module boundaries: `*.go` keeps the
    # first line to the hub root (redistransport/ is formatted by `task rt:fmt`),
    # and the second line covers caddy/.
    desc: Format Go source with golangci-lint fmt — mutates tree (hub root + caddy module)
    preconditions:
      - sh: command -v golangci-lint >/dev/null
        msg: "golangci-lint not found. Install: brew install golangci-lint"
    cmds:
      - golangci-lint fmt *.go
      - cd caddy && golangci-lint fmt --config ../.golangci.yml

  go:fmt:check:
    desc: Verify golangci-lint fmt formatting — hub root + caddy module (CI-safe, non-mutating)
    preconditions:
      - sh: command -v golangci-lint >/dev/null
        msg: "golangci-lint not found. Install: brew install golangci-lint"
    cmds:
      - golangci-lint fmt --diff *.go
      - cd caddy && golangci-lint fmt --diff --config ../.golangci.yml

  md:lint:
    desc: Lint Markdown files with rumdl (uses .rumdl.toml)
    cmds:
      - rumdl check -c .rumdl.toml .

  md:fmt:
    desc: Auto-fix Markdown issues with rumdl
    cmds:
      - rumdl fmt -c .rumdl.toml .

  sh:lint:
    desc: Lint shell scripts (shellcheck + shfmt) — local parity with super-linter
    cmds:
      - shellcheck release.sh scripts/*.sh tests/*.sh redistransport/scripts/*.sh
      - shfmt -d release.sh scripts/*.sh tests/*.sh redistransport/scripts/*.sh

  sh:fmt:
    desc: Auto-format shell scripts with shfmt
    cmds:
      - shfmt -w release.sh scripts/*.sh tests/*.sh redistransport/scripts/*.sh

  ui:lint:
    desc: Lint embedded debug UI JS/CSS (public/) with biome
    dir: public
    cmds:
      - biome lint .

  ui:deps:
    desc: Install ui/ npm dependencies (skipped while node_modules matches package-lock.json)
    dir: ui
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci --ignore-scripts

  ui:check:
    desc: Check UI formatting and vendor reproducibility (non-mutating; dependency freshness is ui:outdated)
    deps: [ui:deps]
    cmds:
      - cd public && biome check .
      - cd ui && node check.js

  ui:outdated:
    desc: Check ui/ npm dependencies are up to date (non-mutating, needs the npm registry)
    deps: [ui:deps]
    dir: ui
    cmds:
      - node outdated.js

  ui:fmt:
    desc: Auto-fix debug UI JS/CSS formatting and lint with biome — mutates tree
    dir: public
    cmds:
      - biome check --write .

  ui:open:
    desc: Open debug UI in browser (HTTPS, requires running hub)
    cmds:
      - open {{.MERCURE_UI}}

  # grafana/dashboard-linter --strict over hub.json; the transport dashboard is
  # linted by rt:lint:dashboard.
  dashboard:lint:
    desc: Lint hub Grafana dashboard JSON with grafana/dashboard-linter --strict
    dir: grafana/dashboards
    preconditions:
      - sh: command -v dashboard-linter >/dev/null
        msg: "dashboard-linter not found: run `task setup`"
    cmds:
      - dashboard-linter lint --strict hub.json
      - 'printf "Hub dashboard JSON: clean\n"'

  go:get:
    desc: Download Go dependencies
    cmds:
      - go get ./... && go mod tidy

  go:get:update:
    desc: Update Go dependencies to latest versions
    cmds:
      - go get -u ./... && go mod tidy

  go:build:_:
    internal: true
    # Per-target label so each GOOS/GOARCH gets its own checksum cache entry.
    label: "go:build:_-{{.TARGET_OS}}-{{.TARGET_ARCH}}"
    deps: [version:check:upstream]
    requires:
      vars: [TARGET_OS, TARGET_ARCH]
    dir: caddy/{{.SVC_NAME}}
    env:
      GOOS: "{{.TARGET_OS}}"
      GOARCH: "{{.TARGET_ARCH}}"
      CGO_ENABLED: "0"
    vars:
      OUT_DIR: "../../{{.BIN_DIR}}/{{.TARGET_OS}}-{{.TARGET_ARCH}}"
    # Incremental skip: rebuild only when any Go source, go.mod/go.sum, or
    # Taskfile.yml itself (which declares GO_BUILD_TAGS, GO_LDFLAGS, and
    # UPSTREAM_VERSION — all baked into the binary) changes. Combined with
    # global `method: checksum`, re-running the task is a no-op when up to date.
    sources:
      - "../../**/*.go"
      - "../../go.mod"
      - "../../go.sum"
      - "../../caddy/go.mod"
      - "../../caddy/go.sum"
      - "../../redistransport/go.mod"
      - "../../redistransport/go.sum"
      - "../../redistransport/caddy/go.mod"
      - "../../redistransport/caddy/go.sum"
      - "../../Taskfile.yml"
      - "../../public/**"
      - exclude: "../../bin/**"
      - exclude: "../../.idea/**"
    generates:
      - "{{.OUT_DIR}}/mercure"
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - go build -ldflags="{{.GO_LDFLAGS}}" -tags={{.GO_BUILD_TAGS}} -o {{.OUT_DIR}}/mercure
      - 'echo "Built: {{.BIN_DIR}}/{{.TARGET_OS}}-{{.TARGET_ARCH}}/mercure"'

  go:build:
    desc: Build Mercure binary for current OS
    cmds:
      - task: go:build:_
        vars: { TARGET_OS: "{{.GO_OS}}", TARGET_ARCH: "{{.GO_ARCH}}" }
      - '{{.BIN_DIR}}/{{.GO_OS}}-{{.GO_ARCH}}/mercure -v'

  go:build:linux:
    desc: Build Mercure binary for Linux (current arch)
    cmds:
      - task: go:build:_
        vars: { TARGET_OS: linux, TARGET_ARCH: "{{.GO_ARCH}}" }

  go:build:linux:amd64:
    desc: Build Mercure binary for Linux x86_64 (amd64)
    cmds:
      - task: go:build:_
        vars: { TARGET_OS: linux, TARGET_ARCH: amd64 }

  go:build:linux:arm64:
    desc: Build Mercure binary for Linux ARM64
    cmds:
      - task: go:build:_
        vars: { TARGET_OS: linux, TARGET_ARCH: arm64 }

  go:build:darwin:arm64:
    desc: Build Mercure binary for macOS Apple Silicon
    cmds:
      - task: go:build:_
        vars: { TARGET_OS: darwin, TARGET_ARCH: arm64 }

  go:lint:
    desc: golangci-lint — hub root + caddy module (transport modules covered by `task rt:lint:all`)
    preconditions:
      - sh: command -v golangci-lint >/dev/null
        msg: "golangci-lint not found. Install: brew install golangci-lint"
    cmds:
      - golangci-lint run --build-tags={{.GO_BUILD_TAGS}} ./...
      - cd caddy && golangci-lint run --build-tags={{.GO_BUILD_TAGS}} ./...

  go:lint:dev:
    # go:lint runs without `dev_ui`; this lints the `//go:build dev_ui` files
    # (public_fs_dev.go). `task ci` runs both.
    desc: golangci-lint — hub root with `dev_ui` build tag (covers the unembedded-UI dev path)
    preconditions:
      - sh: command -v golangci-lint >/dev/null
        msg: "golangci-lint not found. Install: brew install golangci-lint"
    cmds:
      - golangci-lint run --build-tags={{.GO_BUILD_TAGS}},dev_ui ./...

  go:test:dev:
    # Pairs with `go:lint:dev`: runs the test suite with `dev_ui` enabled
    # so the unembedded-UI variant of `publicFS()` is type-checked AND
    # exercised at runtime. Default `go:test` only runs the embed path.
    desc: go test — hub root with `dev_ui` build tag (covers the unembedded-UI dev path)
    cmds:
      - go test ./... -tags={{.GO_BUILD_TAGS}},dev_ui -race

  go:vet:
    desc: go vet — hub root + caddy module
    cmds:
      - go vet -tags={{.GO_BUILD_TAGS}} ./...
      - cd caddy && go vet -tags={{.GO_BUILD_TAGS}} ./...

  go:vet:dev:
    # golangci-lint runs a curated govet subset; this exercises
    # the full analyzer set under `dev_ui`.
    desc: go vet — hub root with `dev_ui` build tag (covers the unembedded-UI dev path)
    cmds:
      - go vet -tags={{.GO_BUILD_TAGS}},dev_ui ./...

  go:vuln:
    desc: govulncheck — hub root
    preconditions:
      - sh: command -v govulncheck >/dev/null
        msg: "govulncheck not found. Install: go install golang.org/x/vuln/cmd/govulncheck@latest"
    cmds:
      - govulncheck -tags={{.GO_BUILD_TAGS}} ./...

  go:vuln:caddy:
    desc: govulncheck — caddy module
    dir: caddy
    preconditions:
      - sh: command -v govulncheck >/dev/null
        msg: "govulncheck not found. Install: go install golang.org/x/vuln/cmd/govulncheck@latest"
    cmds:
      - govulncheck -tags={{.GO_BUILD_TAGS}} ./...

  go:vuln:all:
    desc: Vulnerability scan both hub modules (root + caddy)
    cmds:
      - task: go:vuln
      - task: go:vuln:caddy

  go:test:
    desc: Run Go tests with race + coverage (hub root + caddy module)
    # Caddy reads XDG_CONFIG_HOME/XDG_DATA_HOME before the per-user dirs, so
    # caddytest writes its autosave.json, storage and default Bolt file here
    # instead of the user's Caddy directory. go-task caches `sh:` results by
    # command text, so each task needs its own mktemp template.
    vars:
      TEST_XDG_DIR: { sh: "mktemp -d -t mercure-go-test.XXXXXX" }
    env:
      XDG_CONFIG_HOME: "{{.TEST_XDG_DIR}}/config"
      XDG_DATA_HOME: "{{.TEST_XDG_DIR}}/data"
    cmds:
      - defer: rm -rf "{{.TEST_XDG_DIR}}"
      - go test ./... -race -covermode=atomic -coverprofile=coverage.out -tags={{.GO_BUILD_TAGS}}
      - go tool cover -func=coverage.out
      - cd caddy && go test ./... -race -tags={{.GO_BUILD_TAGS}}

  go:build:check:
    desc: Compile-check all packages — hub root + caddy module (non-mutating, no artifacts)
    cmds:
      - go build -tags={{.GO_BUILD_TAGS}} ./...
      - cd caddy && go build -tags={{.GO_BUILD_TAGS}} ./...

  go:build:check:dev:
    # Catches build errors in `public_fs_dev.go` and its dependents
    # in packages with no `_test.go` under the `dev_ui` tag (which
    # `go:test:dev` would otherwise miss).
    desc: Compile-check all packages — hub root with `dev_ui` build tag
    cmds:
      - go build -tags={{.GO_BUILD_TAGS}},dev_ui ./...

  go:tags:check:
    desc: Verify the fork-owned -tags lists and redistransport's RT_GO_BUILD_TAGS equal GO_BUILD_TAGS
    silent: true
    cmds:
      - cmd: |
          drift=0
          for file in Dockerfile .vscode/launch.json CONTRIBUTING.md AGENTS.md redistransport/compose.valkey.yaml redistransport/conformance.Caddyfile redistransport/redis-test.Caddyfile; do
            found=$(grep -oE -- '-tags[= ]"?[A-Za-z0-9_,]+' "$file" | sed -E 's/^-tags[= ]"?//')
            if [ -z "$found" ]; then
              echo "go:tags:check: no -tags list in $file" >&2
              drift=1
            fi
            for tags in $found; do
              if [ "$tags" != "{{.GO_BUILD_TAGS}}" ]; then
                echo "go:tags:check: DRIFT in $file: -tags $tags, want {{.GO_BUILD_TAGS}} (Taskfile.yml GO_BUILD_TAGS)" >&2
                drift=1
              fi
            done
          done
          rt_tags=$(awk '/^  RT_GO_BUILD_TAGS:/ {print $2}' redistransport/Taskfile.yml)
          if [ "$rt_tags" != "{{.GO_BUILD_TAGS}}" ]; then
            echo "go:tags:check: DRIFT in redistransport/Taskfile.yml: RT_GO_BUILD_TAGS ${rt_tags:-<missing>}, want {{.GO_BUILD_TAGS}} (Taskfile.yml GO_BUILD_TAGS)" >&2
            drift=1
          fi
          [ "$drift" -eq 0 ] || exit 1
          echo "go:tags:check: OK ({{.GO_BUILD_TAGS}})"

  # Race-stress repeat: same -race coverage as go:test, but -count=5 to
  # surface schedule-dependent races a single pass would miss. Tier 2 only.
  go:test:race:repeat:
    desc: Race stress (-race -count=5) — hub root + caddy module — tier 2
    # XDG_* point at a per-task temp dir; see go:test.
    vars:
      TEST_XDG_DIR: { sh: "mktemp -d -t mercure-go-test-race.XXXXXX" }
    env:
      XDG_CONFIG_HOME: "{{.TEST_XDG_DIR}}/config"
      XDG_DATA_HOME: "{{.TEST_XDG_DIR}}/data"
    cmds:
      - defer: rm -rf "{{.TEST_XDG_DIR}}"
      - go test ./... -race -count=5 -tags={{.GO_BUILD_TAGS}}
      - cd caddy && go test ./... -race -count=5 -tags={{.GO_BUILD_TAGS}}

  # ============================================
  # CI pipelines — three tiers (`ci`, `verify`, `verify:full`).
  # ============================================
  # Tier 1 (`task ci`): fast, deterministic (no freshness or advisory lookups). PR gate.
  # Tier 2 (`task verify`): ci + govulncheck and the npm freshness check
  #     (`ui:outdated`, both networked) + race-stress (`-race -count=5`).
  #     Pre-push / merge-queue.
  # Tier 3 (`task verify:full`): verify + real-Redis matrix +
  #     Docker build + Playwright conformance. Release / nightly.
  ci:
    desc: Tier 1 — fast PR gate across all modules (fmt + caddyfile fmt + vet + lint + test + build + tags + ui + md + sh + dashboard)
    cmds:
      - task: go:fmt:check
      - task: rt:fmt:check
      - task: caddy:fmt:check
      - task: go:vet
      - task: go:vet:dev
      - task: rt:vet:all
      - task: go:lint
      - task: go:lint:dev
      - task: rt:lint:all
      - task: go:test
      - task: go:test:dev
      - task: rt:test:all
      - task: go:build:check
      - task: go:build:check:dev
      - task: go:tags:check
      - task: rt:build:all
      - task: ui:check
      - task: md:lint
      - task: sh:lint
      - task: dashboard:lint
      - 'printf "\nTier 1 CI passed. Next: task verify (tier 2) / task verify:full (tier 3)\n"'

  verify:
    desc: Tier 2 — `ci` + govulncheck + npm freshness (ui:outdated) + race-stress (-race -count=5) across all modules
    cmds:
      - task: ci
      - task: go:vuln:all
      - task: rt:vuln:all
      - task: ui:outdated
      - task: go:test:race:repeat
      - task: rt:test:race:repeat:all
      - 'printf "\nTier 2 verify passed. Next: task verify:full for real-Redis + Docker + Playwright\n"'

  verify:full:
    desc: Tier 3 — `verify` + real-Redis matrix (Redis/Valkey/Cluster) + Docker build + Playwright conformance (Redis and Bolt)
    cmds:
      - task: verify
      - task: rt:test:real:matrix
      - task: docker:build
      - task: rt:conformance
      - task: conformance:bolt
      - 'printf "\nTier 3 verify:full passed\n"'

  # Playwright conformance on the default (Bolt) transport, run the way
  # upstream CI does: the bundled Caddyfile, MERCURE_EXTRA_DIRECTIVES=playground
  # (anonymous subscriptions + debugger) and the HS256 dev keys. No `transport`
  # directive is set: the bundled Caddyfile's default is the Bolt module
  # (caddy/mercure.go Provision), its file at <XDG_DATA_HOME>/caddy/mercure.db.
  # XDG_* point at a temp dir, as in go:test. skip_install_trust keeps the
  # run from touching the system trust store. The redis-side pipeline is
  # `task rt:conformance`; the start/wait/stop helper, port preconditions and
  # Playwright install are that task's.
  conformance:bolt:
    desc: Playwright conformance against the bundled Caddyfile on the default Bolt transport (as upstream CI)
    deps: [rt:conformance:preflight]
    vars:
      BOLT_XDG_DIR: { sh: "mktemp -d -t mercure-conformance-bolt.XXXXXX" }
      BOLT_HUB_PID: /tmp/conformance-bolt-hub.pid
    env:
      XDG_CONFIG_HOME: "{{.BOLT_XDG_DIR}}/config"
      XDG_DATA_HOME: "{{.BOLT_XDG_DIR}}/data"
      GLOBAL_OPTIONS: skip_install_trust
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_EXTRA_DIRECTIVES: playground
    cmds:
      - defer: rm -rf "{{.BOLT_XDG_DIR}}"
      # Runs before the rm above (defers are LIFO): the hub holds the Bolt file.
      - defer: '{{.TASKFILE_DIR}}/redistransport/scripts/conformance-hub.sh stop {{.BOLT_HUB_PID}} "mercure run -c \.\./\.\./Caddyfile$"'
      - task: rt:conformance:install
      - task: rt:build:binary
      - 'printf "\nStarting hub in background (output -> /tmp/conformance-bolt-hub.log)...\n"'
      - '{{.TASKFILE_DIR}}/redistransport/scripts/conformance-hub.sh start {{.CADDY_DIR}} {{.BOLT_HUB_PID}} ./mercure run -c ../../Caddyfile'
      - '{{.TASKFILE_DIR}}/redistransport/scripts/conformance-hub.sh wait https://localhost/.well-known/mercure 400 30 {{.BOLT_HUB_PID}}'
      - task: rt:conformance:run

  go:test:short:
    desc: Run Go tests (short mode, no coverage)
    cmds:
      - go test ./... -short -tags={{.GO_BUILD_TAGS}}

  # ============================================
  # Stream Transport (Redis / Valkey) — cross-module run target
  # Unit tests, lint, compose stacks live in redistransport/Taskfile.yml and
  # are reachable as rt:* (e.g. `task rt:test`, `task rt:redis:up`).
  # ============================================
  go:run:redis:
    desc: Run Mercure hub with redistransport (requires Redis/Valkey at localhost:6379)
    dir: caddy/{{.SVC_NAME}}
    cmds:
      - go run -tags={{.GO_BUILD_TAGS}} -race . run -c ../../redistransport/redis-test.Caddyfile

  # ============================================
  # Dev workflows — one-shot scenario targets
  # ============================================
  # `dev:redis`: native hub on the redis transport with the debug UI. Starts
  # rt:redis:up, loads .env.dev.redis over .env.dev, and runs the hub under wgo
  # against local.Caddyfile. Stop with Ctrl-C, then `task rt:redis:down`.
  dev:redis:
    desc: Native hub + redis backend, debug UI on https://localhost; wgo rebuilds on .go, Caddy reloads .Caddyfile via --watch, public/ served live.
    dir: caddy/{{.SVC_NAME}}
    # dotenv is first-wins: .env.local, then .env.dev.redis, then .env.dev.
    dotenv: ['../../.env.local', '../../.env.dev.redis', '../../.env.dev']
    # rt:redis:up sits in cmds: so it starts only after the env checks pass.
    deps: [{ task: _check:env, vars: { FILE: .env.dev.redis } }, { task: _check:env, vars: { FILE: .env.dev } }]
    vars:
      # Opt-in tracing toggle. Passed as a var (not env) because go-task
      # propagates `vars:` across `task:` calls but NOT task-level `env:`,
      # so `dev:full:tracing` can flip this via `vars: {TRACING: "true"}`.
      TRACING: '{{.TRACING | default "false"}}'
      # Optional: `task dev:redis LOG_FILE=/tmp/mercure.log` also appends the
      # hub's stdout and stderr to that file (unset: the tee writes to /dev/null).
      LOG_FILE: '{{.LOG_FILE | default ""}}'
    env:
      # The `dev_ui` build tag swaps //go:embed for os.DirFS. Set the
      # public/ path relative to the task's cwd (the `dir:` above runs
      # this task from caddy/mercure, so the repo's public/ is ../../public).
      MERCURE_PUBLIC_DIR: '../../public'
    cmds:
      - task: rt:redis:up
      - mkdir -p data
      - |
        printf "\n=== Hub starting against redis://localhost:6379 ===\n"
        printf "  Debug UI:     %s  (live UI: edits to public/ are live)\n" "{{.MERCURE_UI}}"
        printf "  RedisInsight: %s\n" "{{.REDISINSIGHT_URL}}"
        printf "  Metrics:      %s\n" "{{.METRICS_URL}}"
        {{if eq .TRACING "true"}}printf "  Jaeger:       http://localhost:16686  (traces; service \"mercure-hub\")\n"{{end}}
        {{if .LOG_FILE}}printf "  Log file:     %s  (hub stdout+stderr tee'd; terminal stream preserved)\n" "{{.LOG_FILE}}"{{end}}
        printf "  Watch:        wgo rebuilds the hub on .go changes across hub + caddy + redistransport modules. Caddyfile edits hot-reload via Caddy's own --watch (no full restart).\n"
        if [ ! -f "$HOME/.caddy-trust-local-sha1" ]; then
            printf "  TLS:          WARN Caddy root cert not yet trusted — browser will warn on first load.\n"
            printf "                After the cert is generated (it will be on first run), run 'task tls:trust' to silence the warning.\n"
        fi
        # Ctrl-C stops only the hub; list the teardown tasks for the Docker
        # sidecars (redis, plus the metrics/Jaeger stacks from dev:full*).
        printf "  Stop:         Ctrl-C, then 'task rt:redis:down'{{if eq .TRACING "true"}} + 'task rt:metrics:down:redis' + 'task rt:tracing:down:redis'{{else}} (+ 'task rt:metrics:down:redis' after dev:full){{end}}\n\n"
      # wgo (-root=../..) rebuilds on .go changes in all four modules; Caddy's
      # own `run -w` reloads local.Caddyfile. `-xdir` uses `(^|/)NAME($|/)`
      # because wgo matches paths relative to the root. Running the built
      # binary (not `go run`) lets SIGINT reach Caddy so it releases :443.
      - |
        {{if eq .TRACING "true"}}
        # Tracing (TRACING=true from dev:full:tracing). Exported here, not in
        # the task env:, so the default loop sets no empty OTEL_* values.
        # PROTOCOL is required: autoexport defaults to http/protobuf (4318),
        # and this points at Jaeger's gRPC port 4317.
        export MERCURE_TRACING_DIRECTIVE=tracing
        export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
        export OTEL_EXPORTER_OTLP_PROTOCOL=grpc
        export OTEL_SERVICE_NAME=mercure-hub
        {{end}}
        # pipefail: a hub crash fails the task instead of being masked by tee.
        set -o pipefail
        # When LOG_FILE is set, fail fast if the path is unwritable rather
        # than letting `tee` silently drop output to a broken sink.
        {{if .LOG_FILE}}
        mkdir -p "$(dirname "{{.LOG_FILE}}")"
        : >> "{{.LOG_FILE}}" || { printf "ERROR: cannot append to LOG_FILE=%s\n" "{{.LOG_FILE}}" >&2; exit 1; }
        printf "[%s] dev:redis session start (LOG_FILE=%s)\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "{{.LOG_FILE}}" >> "{{.LOG_FILE}}"
        {{end}}
        LOG_TARGET={{if .LOG_FILE}}"{{.LOG_FILE}}"{{else}}/dev/null{{end}}
        go run github.com/bokwoon95/wgo@v0.6.4 \
            -file='\.go$' -xfile='_test\.go$' \
            -xdir='(^|/)\.git($|/)' -xdir='(^|/)\.idea($|/)' \
            -xdir='(^|/)node_modules($|/)' -xdir='(^|/)data($|/)' -xdir='(^|/)bin($|/)' \
            -xdir='(^|/)coverage($|/)' -xdir='(^|/)dist($|/)' \
            -root=../.. \
            go build -ldflags="{{.GO_LDFLAGS}}" -tags={{.GO_BUILD_TAGS}},dev_ui -race -o /tmp/mercure-dev . \
            :: /tmp/mercure-dev run -w -c ../../local.Caddyfile \
            2>&1 | tee -a "$LOG_TARGET"

  dev:full:
    desc: redis + RedisInsight + Prometheus + Grafana + redis_exporter + native hub (wgo watch)
    # rt:redis:up first (so the redis network exists when metrics scrapers attach),
    # then rt:metrics:up:redis (Prometheus + Grafana + redis_exporter on the metrics
    # profile), then dev:redis (idempotent rt:redis:up + native hub with wgo).
    # Hoists the env checks so a missing file fails fast BEFORE spinning up
    # Docker stacks (dev:redis's own deps would only fire after the cmds: above
    # already started the redis stack).
    deps: [{ task: _check:env, vars: { FILE: .env.dev.redis } }, { task: _check:env, vars: { FILE: .env.dev } }]
    cmds:
      - task: rt:redis:up
      - task: rt:metrics:up:redis
      - task: dev:redis

  dev:redis:fresh:
    desc: Clean-slate dev:redis — wipe redis volumes + bolt DB, then start
    # rt:redis:down removes containers + volumes (wipes stream, presence,
    # consumer groups). clean:db removes the host-side bolt.db. Then
    # dev:redis brings up a fresh redis stack and the hub.
    # Hoist the env checks so a missing file fails BEFORE the destructive
    # rt:redis:down + clean:db steps — otherwise the convenience command would
    # wipe local state then crash on the downstream check.
    deps: [{ task: _check:env, vars: { FILE: .env.dev.redis } }, { task: _check:env, vars: { FILE: .env.dev } }]
    cmds:
      - task: rt:redis:down
      - task: clean:db
      - task: dev:redis

  dev:full:tracing:
    desc: dev:full + Jaeger — full observability loop (metrics + traces + RedisInsight). Traces at http://localhost:16686
    # Same stack as dev:full plus the profile-gated Jaeger sidecar, then
    # dev:redis with TRACING=true (see that task's `vars:` for why it's a var).
    # Jaeger is opt-in (not in dev:full) because its image is ~80 MB and most
    # dev loops don't trace; `task rt:tracing:down:redis` stops it (this Jaeger
    # runs under the mercure-redis project, not the root `tracing:down` pair).
    deps: [{ task: _check:env, vars: { FILE: .env.dev.redis } }, { task: _check:env, vars: { FILE: .env.dev } }]
    cmds:
      - task: rt:redis:up
      - task: rt:metrics:up:redis
      - task: rt:tracing:up:redis
      - task: dev:redis
        vars: { TRACING: "true" }

  # ============================================
  # Docker Compose (container lifecycle)
  # ============================================
  _check:docker:
    internal: true
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker daemon is not running (start Docker first)"
    cmds:
      - "true"

  caddy:fmt:check:
    desc: Verify every tracked Caddyfile is in `caddy fmt` form (CI-safe, non-mutating)
    deps: [go:build]
    cmds:
      - bash scripts/check-caddyfile-fmt.sh {{.BIN_DIR}}/{{.GO_OS}}-{{.GO_ARCH}}/mercure

  caddy:validate:
    desc: Validate CADDYFILE syntax with the Mercure binary (uses .env.dev by default)
    deps: [go:build, { task: _check:env, vars: { FILE: .env.dev } }]
    cmds:
      - "{{.BIN_DIR}}/{{.GO_OS}}-{{.GO_ARCH}}/mercure validate --config {{.CADDYFILE}} --adapter caddyfile"

  up:
    desc: Start Mercure hub container
    deps: [_check:docker, _check:env]
    cmds:
      - docker compose up

  tracing:up:
    desc: Bring up the hub stack plus Jaeger (web UI at http://localhost:16686)
    deps: [_check:docker, _check:env]
    cmds:
      - docker compose --profile tracing up -d
      - 'printf "\nJaeger UI: http://localhost:16686 (service: mercure-hub)\nTraces appear once MERCURE_TRACING_DIRECTIVE=tracing is set in the env file — see docs/production/tracing.md\n"'

  tracing:down:
    desc: Stop Jaeger on the root hub stack (pairs with tracing:up)
    # Pairs with tracing:up — both target the root `compose` project (the bolt
    # hub stack). The Redis dev loop (dev:full:tracing) starts its Jaeger under
    # the mercure-redis project instead; tear that one down with
    # `task rt:tracing:down:redis`.
    cmds:
      - docker compose --profile tracing stop jaeger
      - docker compose --profile tracing rm -f jaeger

  up:detach:
    desc: Start Mercure hub container (detached)
    aliases: [upd]
    deps: [_check:docker, _check:env]
    cmds:
      - docker compose up -d

  up:build:
    desc: Build and start Mercure hub container (detached, trusts TLS cert)
    deps: [_check:docker, _check:env, version:check:upstream]
    cmds:
      # Dockerfile is multi-stage — builds the Mercure binary from source
      # inside the build stage, so no host pre-build or binary staging is needed.
      - docker compose up --build -d --wait
      # Best-effort: ignore_error so a headless / locked-keychain box (where
      # `security add-trusted-cert` can't get GUI auth) doesn't fail the build.
      # Run `task tls:trust:docker` manually when needed.
      - task: tls:trust:docker
        ignore_error: true

  down:
    desc: Stop and remove containers (keeps volumes)
    deps: [_check:docker]
    cmds:
      - docker compose down --remove-orphans

  down:clean:
    desc: Stop and remove containers and volumes
    deps: [_check:docker]
    cmds:
      - docker compose down -v --remove-orphans

  restart:
    desc: Restart Mercure hub container
    deps: [_check:docker]
    cmds:
      - docker compose restart {{.CONTAINER_NAME}}

  ps:
    desc: Show container status
    deps: [_check:docker]
    cmds:
      - docker compose ps

  logs:
    desc: Follow container logs
    deps: [_check:docker]
    aliases: [l]
    cmds:
      - docker compose logs -f {{.CONTAINER_NAME}}

  logs:tail:
    desc: Show last 100 log lines
    deps: [_check:docker]
    cmds:
      - docker compose logs --tail=100 {{.CONTAINER_NAME}}

  # ============================================
  # Docker Build
  # ============================================
  docker:build:_:
    internal: true
    deps: [_check:docker, version:check:upstream]
    requires:
      vars: [TARGET_PLATFORM, TARGET_IMAGE]
    env:
      PLATFORM: "{{.TARGET_PLATFORM}}"
      SVC_IMAGE: "{{.TARGET_IMAGE}}"
    cmds:
      - docker compose build {{.SVC_NAME}}
      - 'echo "Built: {{.TARGET_IMAGE}}"'

  docker:build:
    desc: Build Docker image (current arch)
    cmds:
      - task: docker:build:_
        vars: { TARGET_PLATFORM: "{{.DOCKER_OS}}/{{.GO_ARCH}}", TARGET_IMAGE: "{{.SVC_IMAGE}}" }

  docker:build:amd64:
    desc: Build Docker image for Linux x86_64 (amd64)
    cmds:
      - task: docker:build:_
        vars: { TARGET_PLATFORM: linux/amd64, TARGET_IMAGE: "{{.IMAGE_REPO}}:{{.SVC_VERSION}}-linux-amd64" }

  docker:build:arm64:
    desc: Build Docker image for Linux ARM64
    cmds:
      - task: docker:build:_
        vars: { TARGET_PLATFORM: linux/arm64, TARGET_IMAGE: "{{.IMAGE_REPO}}:{{.SVC_VERSION}}-linux-arm64" }

  docker:tag:
    desc: Show current image tag
    cmds:
      - echo "{{.SVC_IMAGE}}"

  # ============================================
  # Monitoring (health, status, metrics)
  # ============================================
  health:
    desc: Check if Mercure hub is healthy (transport-aware via admin API)
    cmds:
      - |
        if curl -sf http://localhost:2019/mercure/health/ready > /dev/null 2>&1; then
          echo "Mercure hub is healthy"
        else
          echo "Mercure hub is not responding"
          exit 1
        fi

  status:
    desc: Show service status and configuration
    cmds:
      - 'echo "Mercure Hub Status"'
      - 'echo "=================="'
      - 'echo "Image: {{.SVC_IMAGE}}"'
      - 'echo "Container: {{.CONTAINER_NAME}}"'
      - 'echo ""'
      - docker compose ps 2>/dev/null || echo "Container not running"

  metrics:
    desc: Fetch Prometheus metrics from Mercure hub
    cmds:
      - curl -sf {{.METRICS_URL}} || { echo "Metrics endpoint not responding"; exit 1; }

  metrics:mercure:
    desc: Show Mercure-specific metrics only
    cmds:
      - |
        curl -sf {{.METRICS_URL}} | grep "^mercure_" || {
          echo "No Mercure metrics found (hub may not have received traffic yet)"
        }

  metrics:watch:
    desc: Watch live subscriber count (refreshes every 2s)
    cmds:
      - |
        echo "Watching mercure_subscribers_connected (Ctrl+C to stop)"
        while true; do
          count=$(curl -sf {{.METRICS_URL}} | grep "^mercure_subscribers_connected " | awk '{print $2}')
          echo "$(date +%H:%M:%S) subscribers_connected: ${count:-0}"
          sleep 2
        done

  # ============================================
  # Container Inspection
  # ============================================
  exec:
    desc: Open shell in Mercure container
    deps: [_check:docker]
    cmds:
      - docker compose exec {{.CONTAINER_NAME}} sh

  inspect:
    desc: Inspect container configuration
    deps: [_check:docker]
    cmds:
      - docker inspect {{.CONTAINER_NAME}} | jq .

  inspect:health:
    desc: Show container health status
    deps: [_check:docker]
    cmds:
      - docker inspect --format='{{`{{json .State.Health}}`}}' {{.CONTAINER_NAME}} | jq .

  inspect:env:
    desc: Show container environment variables
    deps: [_check:docker]
    cmds:
      - docker compose exec {{.CONTAINER_NAME}} env | sort

  # ============================================
  # Cleanup
  # ============================================
  clean:
    desc: Clean build artifacts (keeps database)
    cmds:
      - rm -rf bin/
      - find . -name "*.out" -type f -delete
      - 'echo "Cleaned build artifacts"'

  clean:binary:
    desc: Remove compiled binaries for current version
    cmds:
      - rm -rf {{.BIN_DIR}}
      - 'echo "Cleaned: {{.BIN_DIR}}"'

  clean:binary:all:
    desc: Remove all compiled binaries
    cmds:
      - rm -rf bin/
      - 'echo "Cleaned: bin/"'

  clean:db:
    desc: Remove Bolt database (host-side, for go:run)
    cmds:
      - rm -rf {{.CADDY_DIR}}/data/
      - 'echo "Cleaned host database files (use clean:volumes for Docker)"'

  clean:docker:
    desc: Stop container and prune dangling images
    deps: [down]
    cmds:
      - docker image prune --filter dangling=true -f

  clean:image:
    desc: Remove the Mercure Docker image
    # Guard on the daemon (a daemon-down `inspect` must not read as "absent"), and
    # inspect-then-rmi so a real "image in use" error surfaces instead of being
    # swallowed by `2>/dev/null || true`.
    deps: [_check:docker]
    cmds:
      - 'if docker image inspect {{.SVC_IMAGE}} >/dev/null 2>&1; then docker rmi {{.SVC_IMAGE}} && echo "Removed: {{.SVC_IMAGE}}"; else echo "{{.SVC_IMAGE}} not present"; fi'

  clean:volumes:
    desc: Remove all Docker volumes (TLS certs, config, data, metrics)
    # Daemon-guarded; inspect-then-rm, accumulating rc so an in-use volume fails
    # the task (a loop's exit status is only its last iteration's).
    deps: [_check:docker]
    cmds:
      - |
        rc=0
        for v in compose_mercure_data compose_mercure_config compose_prometheus_data compose_grafana_data; do
          if docker volume inspect "$v" >/dev/null 2>&1; then
            if docker volume rm "$v"; then echo "removed $v"; else echo "FAILED to remove $v (in use?)" >&2; rc=1; fi
          else
            echo "$v not present"
          fi
        done
        exit $rc

  clean:volumes:mercure:
    desc: Remove Mercure data and config volumes
    deps: [_check:docker]
    cmds:
      - |
        rc=0
        for v in compose_mercure_data compose_mercure_config; do
          if docker volume inspect "$v" >/dev/null 2>&1; then
            if docker volume rm "$v"; then echo "removed $v"; else echo "FAILED to remove $v (in use?)" >&2; rc=1; fi
          else echo "$v not present"; fi
        done
        exit $rc

  clean:volumes:prometheus:
    desc: Remove Prometheus data volume
    deps: [_check:docker]
    cmds:
      - 'if docker volume inspect compose_prometheus_data >/dev/null 2>&1; then docker volume rm compose_prometheus_data && echo "removed compose_prometheus_data"; else echo "compose_prometheus_data not present"; fi'

  clean:volumes:grafana:
    desc: Remove Grafana data volume
    deps: [_check:docker]
    cmds:
      - 'if docker volume inspect compose_grafana_data >/dev/null 2>&1; then docker volume rm compose_grafana_data && echo "removed compose_grafana_data"; else echo "compose_grafana_data not present"; fi'

  clean:all:
    desc: Full cleanup (binary, database, containers, images, volumes)
    deps: [_check:docker]
    cmds:
      - task: down
      - task: clean
      - task: clean:db
      - task: clean:volumes
      - docker image prune --filter dangling=true -f
      - 'if docker image inspect {{.SVC_IMAGE}} >/dev/null 2>&1; then docker rmi {{.SVC_IMAGE}} && echo "Removed: {{.SVC_IMAGE}}"; else echo "{{.SVC_IMAGE}} not present"; fi'
      - 'echo "Cleaned all Mercure resources"'


  # ============================================
  # Version Management
  # ============================================
  # SVC_VERSION is the fork's image tag, bumped by version:bump:* and
  # version:set. These tasks leave charts/mercure/Chart.yaml alone: its
  # appVersion tracks upstream and is bumped by version:bump:upstream (part of
  # `task upstream:sync`).
  # ============================================
  version:
    desc: Show current version
    cmds:
      - 'echo "{{.SVC_VERSION}}"'

  version:full:
    desc: Show full version details
    cmds:
      - 'echo "Version:  {{.SVC_VERSION}}"'
      - 'echo "Upstream: {{.UPSTREAM_VERSION}}"'
      - 'echo "Transport: {{.RT_VERSION}}"'
      - 'echo "Image:    {{.SVC_IMAGE}}"'

  version:bump:patch:
    desc: "Bump patch version (e.g., vX.Y.Z -> vX.Y.(Z+1))"
    vars:
      CURRENT: "{{.SVC_VERSION}}"
      # awk coerces pre-release suffixes (e.g., "0-rc" -> 0) so v1.0.0-rc.1 bumps to v1.0.1
      NEXT:
        sh: "echo \"{{.SVC_VERSION}}\" | sed 's/^v//' | awk -F. '{printf \"v%d.%d.%d\", $1, $2, $3+1}'"
    cmds:
      - "perl -i -pe 's/\\QSVC_VERSION: {{.CURRENT}}\\E/SVC_VERSION: {{.NEXT}}/' Taskfile.yml"
      - 'echo "Bumped: {{.CURRENT}} -> {{.NEXT}}"'

  version:bump:minor:
    desc: "Bump minor version (e.g., vX.Y.Z -> vX.(Y+1).0)"
    vars:
      CURRENT: "{{.SVC_VERSION}}"
      NEXT:
        sh: "echo \"{{.SVC_VERSION}}\" | sed 's/^v//' | awk -F. '{printf \"v%d.%d.0\", $1, $2+1}'"
    cmds:
      - "perl -i -pe 's/\\QSVC_VERSION: {{.CURRENT}}\\E/SVC_VERSION: {{.NEXT}}/' Taskfile.yml"
      - 'echo "Bumped: {{.CURRENT}} -> {{.NEXT}}"'

  version:bump:major:
    desc: "Bump major version (e.g., vX.Y.Z -> v(X+1).0.0)"
    vars:
      CURRENT: "{{.SVC_VERSION}}"
      NEXT:
        sh: "echo \"{{.SVC_VERSION}}\" | sed 's/^v//' | awk -F. '{printf \"v%d.0.0\", $1+1}'"
    cmds:
      - "perl -i -pe 's/\\QSVC_VERSION: {{.CURRENT}}\\E/SVC_VERSION: {{.NEXT}}/' Taskfile.yml"
      - 'echo "Bumped: {{.CURRENT}} -> {{.NEXT}}"'

  version:set:
    desc: "Set version explicitly (usage: task version:set V=v1.2.3)"
    requires:
      vars: [V]
    # V is exported via env so the precondition shell reads it as a literal
    # value (no shell expansion) — guards against malicious V like
    # `'; rm -rf ~; echo '` that would otherwise interpolate into the perl
    # cmds below (which substitute `{{.V}}` at template time, BEFORE shell
    # sees the result — a single-quote in V would close perl's `s///`
    # delimiter and let the remainder hit shell).
    env:
      V: '{{.V}}'
    preconditions:
      - sh: '[[ "$V" =~ {{.TAG_VERSION_REGEX}} ]]'
        msg: 'V must be semver with leading "v" (e.g. v1.2.3 or v1.2.3-rc.1), got: {{.V}}'
    cmds:
      - "perl -i -pe 's/\\QSVC_VERSION: {{.SVC_VERSION}}\\E/SVC_VERSION: {{.V}}/' Taskfile.yml"
      - 'echo "Set: {{.SVC_VERSION}} -> {{.V}}"'

  # ============================================
  # Redistransport version bumps
  # ============================================
  # RT_VERSION lives in Taskfile.yml and the Dockerfile ARG, and is stamped
  # into the binary through GO_LDFLAGS.
  # ============================================
  version:bump:rt:patch:
    desc: "Bump redistransport patch version (e.g., v0.1.0 -> v0.1.1)"
    vars:
      CURRENT: "{{.RT_VERSION}}"
      NEXT:
        sh: "echo \"{{.RT_VERSION}}\" | sed 's/^v//' | awk -F. '{printf \"v%d.%d.%d\", $1, $2, $3+1}'"
    cmds:
      # Match `RT_VERSION:` + v-prefixed value flexibly. CAN'T interpolate
      # `{{.RT_VERSION}}` (or {{.CURRENT}} which derives from it) into the
      # search pattern: the included `redistransport/Taskfile.yml` defines
      # `RT_VERSION: x.y.z` (no v — for the Go ldflag) which shadows root's
      # `vx.y.z` at template time, breaking the literal-match substitution.
      - "perl -i -pe 's/RT_VERSION:\\s+v\\S+/RT_VERSION: {{.NEXT}}/' Taskfile.yml"
      - "perl -i -pe 's/\\QARG RT_VERSION=\\E.*/ARG RT_VERSION={{.NEXT}}/' Dockerfile"
      - 'grep -q "^  RT_VERSION: {{.NEXT}}$" Taskfile.yml || { echo "rt bump: Taskfile.yml RT_VERSION not updated to {{.NEXT}}"; exit 1; }'
      - 'grep -q "^ARG RT_VERSION={{.NEXT}}$" Dockerfile || { echo "rt bump: Dockerfile ARG RT_VERSION not updated to {{.NEXT}}"; exit 1; }'
      # The included redistransport/Taskfile.yml carries the no-v ldflag value
      # (RT_VERSION: x.y.z) the release preconditions read; bump it too or every
      # release blocks on the V != RT_VERSION gate.
      - "perl -i -pe 's/^  RT_VERSION:\\s+\\S+/  RT_VERSION: {{trimPrefix \"v\" .NEXT}}/' redistransport/Taskfile.yml"
      - 'grep -q "^  RT_VERSION: {{trimPrefix "v" .NEXT}}$" redistransport/Taskfile.yml || { echo "rt bump: redistransport/Taskfile.yml RT_VERSION not updated to {{trimPrefix "v" .NEXT}}"; exit 1; }'
      - 'echo "Redistransport bumped: {{.CURRENT}} -> {{.NEXT}}"'

  version:bump:rt:minor:
    desc: "Bump redistransport minor version (e.g., v0.1.1 -> v0.2.0)"
    vars:
      CURRENT: "{{.RT_VERSION}}"
      NEXT:
        sh: "echo \"{{.RT_VERSION}}\" | sed 's/^v//' | awk -F. '{printf \"v%d.%d.0\", $1, $2+1}'"
    cmds:
      # Match `RT_VERSION:` + v-prefixed value flexibly. CAN'T interpolate
      # `{{.RT_VERSION}}` (or {{.CURRENT}} which derives from it) into the
      # search pattern: the included `redistransport/Taskfile.yml` defines
      # `RT_VERSION: x.y.z` (no v — for the Go ldflag) which shadows root's
      # `vx.y.z` at template time, breaking the literal-match substitution.
      - "perl -i -pe 's/RT_VERSION:\\s+v\\S+/RT_VERSION: {{.NEXT}}/' Taskfile.yml"
      - "perl -i -pe 's/\\QARG RT_VERSION=\\E.*/ARG RT_VERSION={{.NEXT}}/' Dockerfile"
      - 'grep -q "^  RT_VERSION: {{.NEXT}}$" Taskfile.yml || { echo "rt bump: Taskfile.yml RT_VERSION not updated to {{.NEXT}}"; exit 1; }'
      - 'grep -q "^ARG RT_VERSION={{.NEXT}}$" Dockerfile || { echo "rt bump: Dockerfile ARG RT_VERSION not updated to {{.NEXT}}"; exit 1; }'
      # The included redistransport/Taskfile.yml carries the no-v ldflag value
      # (RT_VERSION: x.y.z) the release preconditions read; bump it too or every
      # release blocks on the V != RT_VERSION gate.
      - "perl -i -pe 's/^  RT_VERSION:\\s+\\S+/  RT_VERSION: {{trimPrefix \"v\" .NEXT}}/' redistransport/Taskfile.yml"
      - 'grep -q "^  RT_VERSION: {{trimPrefix "v" .NEXT}}$" redistransport/Taskfile.yml || { echo "rt bump: redistransport/Taskfile.yml RT_VERSION not updated to {{trimPrefix "v" .NEXT}}"; exit 1; }'
      - 'echo "Redistransport bumped: {{.CURRENT}} -> {{.NEXT}}"'

  version:bump:rt:major:
    desc: "Bump redistransport major version (e.g., v0.1.1 -> v1.0.0)"
    vars:
      CURRENT: "{{.RT_VERSION}}"
      NEXT:
        sh: "echo \"{{.RT_VERSION}}\" | sed 's/^v//' | awk -F. '{printf \"v%d.0.0\", $1+1}'"
    cmds:
      # Match `RT_VERSION:` + v-prefixed value flexibly. CAN'T interpolate
      # `{{.RT_VERSION}}` (or {{.CURRENT}} which derives from it) into the
      # search pattern: the included `redistransport/Taskfile.yml` defines
      # `RT_VERSION: x.y.z` (no v — for the Go ldflag) which shadows root's
      # `vx.y.z` at template time, breaking the literal-match substitution.
      - "perl -i -pe 's/RT_VERSION:\\s+v\\S+/RT_VERSION: {{.NEXT}}/' Taskfile.yml"
      - "perl -i -pe 's/\\QARG RT_VERSION=\\E.*/ARG RT_VERSION={{.NEXT}}/' Dockerfile"
      - 'grep -q "^  RT_VERSION: {{.NEXT}}$" Taskfile.yml || { echo "rt bump: Taskfile.yml RT_VERSION not updated to {{.NEXT}}"; exit 1; }'
      - 'grep -q "^ARG RT_VERSION={{.NEXT}}$" Dockerfile || { echo "rt bump: Dockerfile ARG RT_VERSION not updated to {{.NEXT}}"; exit 1; }'
      # The included redistransport/Taskfile.yml carries the no-v ldflag value
      # (RT_VERSION: x.y.z) the release preconditions read; bump it too or every
      # release blocks on the V != RT_VERSION gate.
      - "perl -i -pe 's/^  RT_VERSION:\\s+\\S+/  RT_VERSION: {{trimPrefix \"v\" .NEXT}}/' redistransport/Taskfile.yml"
      - 'grep -q "^  RT_VERSION: {{trimPrefix "v" .NEXT}}$" redistransport/Taskfile.yml || { echo "rt bump: redistransport/Taskfile.yml RT_VERSION not updated to {{trimPrefix "v" .NEXT}}"; exit 1; }'
      - 'echo "Redistransport bumped: {{.CURRENT}} -> {{.NEXT}}"'

  version:set:rt:
    desc: "Set redistransport version explicitly (usage: task version:set:rt V=v1.2.3)"
    requires:
      vars: [V]
    # V is exported via env so the precondition shell reads it as a literal
    # value (no shell expansion) — guards against malicious V like
    # `'; rm -rf ~; echo '` that would otherwise interpolate into the perl
    # cmds below.
    env:
      V: '{{.V}}'
    preconditions:
      - sh: '[[ "$V" =~ {{.TAG_VERSION_REGEX}} ]]'
        msg: 'V must be semver with leading "v" (e.g. v1.2.3 or v1.2.3-rc.1), got: {{.V}}'
    cmds:
      # Match `RT_VERSION:` + v-prefixed value flexibly. CAN'T interpolate
      # `{{.RT_VERSION}}` into the pattern: the included `redistransport/
      # Taskfile.yml` defines `RT_VERSION: x.y.z` (no v — for the Go ldflag)
      # which shadows root's `vx.y.z` at template time.
      - "perl -i -pe 's/RT_VERSION:\\s+v\\S+/RT_VERSION: {{.V}}/' Taskfile.yml"
      - "perl -i -pe 's/\\QARG RT_VERSION=\\E.*/ARG RT_VERSION={{.V}}/' Dockerfile"
      - 'grep -q "^  RT_VERSION: {{.V}}$" Taskfile.yml || { echo "version:set:rt: Taskfile.yml RT_VERSION not updated to {{.V}}"; exit 1; }'
      - 'grep -q "^ARG RT_VERSION={{.V}}$" Dockerfile || { echo "version:set:rt: Dockerfile ARG RT_VERSION not updated to {{.V}}"; exit 1; }'
      # The included redistransport/Taskfile.yml carries the no-v ldflag value
      # the release preconditions read; bump it too or every release blocks on
      # the V != RT_VERSION gate.
      - "perl -i -pe 's/^  RT_VERSION:\\s+\\S+/  RT_VERSION: {{trimPrefix \"v\" .V}}/' redistransport/Taskfile.yml"
      - 'grep -q "^  RT_VERSION: {{trimPrefix "v" .V}}$" redistransport/Taskfile.yml || { echo "version:set:rt: redistransport/Taskfile.yml RT_VERSION not updated to {{trimPrefix "v" .V}}"; exit 1; }'
      - 'echo "Redistransport set: {{.RT_VERSION}} -> {{.V}}"'

  version:bump:upstream:
    desc: "Set upstream version (usage: task version:bump:upstream V=v1.0.3)"
    requires:
      vars: [V]
    cmds:
      # Each substitute is followed by a grep guard that fails the task if
      # the new value isn't present after the edit. Perl's `s///` exits 0
      # on zero substitutions (e.g. when a file already drifted off the
      # anchored old value), which would otherwise produce a "successful"
      # bump that silently leaves one of the three files stale.
      - "perl -i -pe 's/\\QUPSTREAM_VERSION: {{.UPSTREAM_VERSION}}\\E/UPSTREAM_VERSION: {{.V}}/' Taskfile.yml"
      - 'grep -q "^  UPSTREAM_VERSION: {{.V}}$" Taskfile.yml || { echo "version:bump:upstream: Taskfile.yml not updated to {{.V}} (current value is not the anchored old)"; exit 1; }'
      - "perl -i -pe 's/\\QARG UPSTREAM_VERSION=\\E.*/ARG UPSTREAM_VERSION={{.V}}/' Dockerfile"
      - 'grep -q "^ARG UPSTREAM_VERSION={{.V}}$" Dockerfile || { echo "version:bump:upstream: Dockerfile not updated to {{.V}}"; exit 1; }'
      - "perl -i -pe 's/\\QappVersion: \"{{.UPSTREAM_VERSION}}\"\\E/appVersion: \"{{.V}}\"/' charts/mercure/Chart.yaml"
      - 'grep -q "^appVersion: \"{{.V}}\"$" charts/mercure/Chart.yaml || { echo "version:bump:upstream: charts/mercure/Chart.yaml not updated to {{.V}} (anchor mismatch — Chart.yaml may have drifted)"; exit 1; }'
      - 'echo "Upstream: {{.UPSTREAM_VERSION}} -> {{.V}}"'

  version:check:upstream:
    desc: "Verify declared UPSTREAM_VERSION matches the upstream tag reachable from HEAD"
    silent: true
    vars:
      MERGE_BASE:
        sh: git merge-base HEAD upstream/{{.UPSTREAM_LINE}} 2>/dev/null || true
      EXPECTED:
        sh: |
          base=$(git merge-base HEAD upstream/{{.UPSTREAM_LINE}} 2>/dev/null) || exit 0
          git describe --tags --match 'v[0-9]*' --abbrev=0 "$base" 2>/dev/null || true
      DECLARED_TASKFILE: "{{.UPSTREAM_VERSION}}"
      DECLARED_DOCKERFILE:
        sh: 'awk -F= ''/^ARG UPSTREAM_VERSION=/ {print $2}'' Dockerfile'
      DECLARED_CHART:
        sh: 'awk ''/^appVersion:/ {gsub(/"/, "", $2); print $2}'' charts/mercure/Chart.yaml'
    cmds:
      - cmd: |
          if [ -z "{{.MERGE_BASE}}" ]; then
            echo "version:check:upstream: cannot locate upstream/{{.UPSTREAM_LINE}}." >&2
            echo "  Run: git fetch upstream {{.UPSTREAM_LINE}} --tags" >&2
            exit 1
          fi
          if [ -z "{{.EXPECTED}}" ]; then
            echo "version:check:upstream: no v* tag reachable from merge-base {{.MERGE_BASE}}." >&2
            echo "  Run: git fetch upstream --tags" >&2
            exit 1
          fi
          drift=0
          for label_value in \
              "Taskfile.yml:{{.DECLARED_TASKFILE}}" \
              "Dockerfile:{{.DECLARED_DOCKERFILE}}" \
              "charts/mercure/Chart.yaml:{{.DECLARED_CHART}}"; do
            file="${label_value%%:*}"
            value="${label_value#*:}"
            if [ "$value" != "{{.EXPECTED}}" ]; then
              echo "version:check:upstream: DRIFT in $file" >&2
              echo "  expected: {{.EXPECTED}} (from upstream/{{.UPSTREAM_LINE}} ancestry at {{.MERGE_BASE}})" >&2
              echo "  found:    $value" >&2
              drift=1
            fi
          done
          if [ "$drift" -ne 0 ]; then
            echo "" >&2
            echo "Run: task version:bump:upstream V={{.EXPECTED}}" >&2
            echo "Then re-verify: task version:check:upstream" >&2
            exit 1
          fi
          echo "version:check:upstream: OK ({{.EXPECTED}})"

  version:check:upstream:fetch:
    desc: "Fetch upstream tags then verify (slower, network-dependent)"
    silent: true
    cmds:
      - git fetch upstream {{.UPSTREAM_LINE}} --tags
      - task: version:check:upstream

  upstream:preview:
    desc: "Show upstream commits + code-file diff since the declared UPSTREAM_VERSION (read-only)"
    vars:
      # LINE_TAG: latest tag on upstream/{{.UPSTREAM_LINE}}, the only valid sync
      # target (used by upstream:sync and version:check:upstream). LATEST_TAG_ANY:
      # newest tag on any branch, which can belong to another release line.
      LINE_TAG:
        sh: git fetch upstream --tags 2>/dev/null && git describe --tags --match 'v[0-9]*' --abbrev=0 upstream/{{.UPSTREAM_LINE}} 2>/dev/null
      LATEST_TAG_ANY:
        sh: git tag -l 'v*' --sort=-v:refname | head -1
    cmds:
      - cmd: |
          echo "Declared in fork:                        {{.UPSTREAM_VERSION}}"
          echo "upstream/{{.UPSTREAM_LINE}} tracks (sync target):  {{.LINE_TAG}}"
          echo "Latest tag (any branch):                 {{.LATEST_TAG_ANY}}"
          if [ "{{.LINE_TAG}}" != "{{.LATEST_TAG_ANY}}" ]; then
            echo ""
            echo "NOTE: {{.LATEST_TAG_ANY}} is newer than what upstream/{{.UPSTREAM_LINE}} tracks ({{.LINE_TAG}})."
            echo "      It comes from another release line, so it is not a sync target:"
            echo "      upstream:sync follows upstream/{{.UPSTREAM_LINE}} and bumps to {{.LINE_TAG}}."
            echo "      Check the commit list below for fixes you still need."
          fi
          echo ""
          echo "Commits since {{.UPSTREAM_VERSION}}:"
          git log --oneline {{.UPSTREAM_VERSION}}..upstream/{{.UPSTREAM_LINE}} -- ':!docs' ':!.github' ':!gatling' ':!charts' 2>/dev/null || echo "  (none or tag not found locally)"
          echo ""
          echo "Changed files (code only):"
          git diff --stat {{.UPSTREAM_VERSION}}..upstream/{{.UPSTREAM_LINE}} -- '*.go' 'go.*' 2>/dev/null || true

  upstream:sync:
    desc: "Upstream sync: fast-forward main from upstream/main, rebase fork/main onto upstream/{{.UPSTREAM_LINE}}, bump UPSTREAM_VERSION, verify"
    vars:
      LATEST_TAG:
        sh: git fetch upstream --tags 2>/dev/null; git describe --tags --match 'v[0-9]*' --abbrev=0 upstream/{{.UPSTREAM_LINE}} 2>/dev/null
    preconditions:
      # The cmds check out main and then fork/main; run only from fork/main so a
      # linked worktree is not moved off its own branch.
      - sh: test "$(git branch --show-current)" = "fork/main"
        msg: "upstream:sync must be run from fork/main, not the current branch. Check out fork/main first."
      - sh: test -n "{{.LATEST_TAG}}"
        msg: "No upstream tag found on upstream/{{.UPSTREAM_LINE}}. Run 'git fetch upstream {{.UPSTREAM_LINE}} --tags'."
      - sh: test -z "$(git status --porcelain)"
        msg: "Working directory is dirty. Commit or stash changes first."
      # `.git` is a file (not a directory) in a linked worktree, so a
      # literal `.git/rebase-merge` path never exists there and this
      # precondition would always pass. `git rev-parse --git-path` resolves
      # the real per-worktree path (under `.git/worktrees/<name>/` for a
      # linked worktree) in both cases.
      - sh: test ! -d "$(git rev-parse --git-path rebase-merge)" && test ! -d "$(git rev-parse --git-path rebase-apply)"
        msg: "Active rebase detected. Resolve and 'git rebase --continue' first."
    cmds:
      - git checkout main
      - git merge --ff-only upstream/main
      - git checkout fork/main
      - git rebase upstream/{{.UPSTREAM_LINE}}
      - task: version:bump:upstream
        vars:
          V: "{{.LATEST_TAG}}"
      - task: version:check:upstream
      - 'echo ""'
      - 'echo "Synced fork/main onto upstream/{{.UPSTREAM_LINE}} and bumped to {{.LATEST_TAG}}."'
      - 'echo "Review the diff, run task go:build, then commit the bump."'

  # ============================================
  # Release lifecycle (redistransport only)
  # ============================================
  # The hub image is built locally (docker:*, up:build); only the
  # redistransport Go module is released, as GitHub releases tagged
  # `redistransport/vX.Y.Z`.
  #
  # Operator: `version:set:rt V=...` → add `## [X.Y.Z]` to
  # redistransport/CHANGELOG.md (no `v` in the heading) → optionally
  # redistransport/releases/$V.pre.md for first releases or major bumps →
  # commit → `release:create V=...`.
  #
  # `tag` + `publish` are split so CI can `publish` on a tag-push event
  # using `GH_TOKEN` for `gh auth`; operator signs locally. Tasks below
  # are preconditions + one `bash scripts/release.sh ...` invocation.
  # Requires `gh` ≥ 2.46.
  # ============================================

  release:tag:
    desc: "Sign + push the redistransport tag (V=v0.1.0 [REMOTE=origin])"
    requires:
      vars: [V]
    env:
      V: '{{.V}}'
      REMOTE: '{{.REMOTE | default "origin"}}'
    preconditions:
      # REMOTE-name validation FIRST. Without this, `REMOTE='--upload-pack=cmd'`
      # is parsed by `git ls-remote` as a flag and executes `cmd` locally.
      - sh: '[[ "$REMOTE" =~ ^[A-Za-z][A-Za-z0-9._/-]*$ ]]'
        msg: 'REMOTE must be a simple git remote name (got: {{.REMOTE | default "origin"}})'
      - sh: '[[ "$V" =~ {{.TAG_VERSION_REGEX}} ]]'
        msg: 'V must be vX.Y.Z[-suffix] (got: {{.V}})'
      # RT_VERSION resolves to the form used by `redistransport/Taskfile.yml`
      # (no `v` prefix — used in the binary's version ldflag). The git tag
      # form (with `v`) is the operator's V= input. Strip `v` from V for
      # comparison; the msg shows the operator-facing `v`-prefixed form.
      - sh: 'test "${V#v}" = "{{.RT_VERSION}}"'
        msg: 'V ({{.V}}) does not match RT_VERSION (v{{.RT_VERSION}}). Bump first via `task version:set:rt V=...`.'
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = "fork/main" ]'
        msg: 'Release must run from the fork/main branch.'
      - sh: 'test -z "$(git status --porcelain)"'
        msg: 'Working tree dirty. Commit or stash before releasing. Run `git status` to see dirty paths.'
      # The CHANGELOG section must exist before the tag is signed and pushed;
      # otherwise release:publish rejects it and the signed tag needs release:delete.
      - sh: 'test -f redistransport/CHANGELOG.md'
        msg: 'redistransport/CHANGELOG.md not found.'
      - sh: 'awk -v v="$V" -v mode=check -f scripts/extract-changelog-section.awk redistransport/CHANGELOG.md'
        msg: 'No release notes section found for {{.V}} in redistransport/CHANGELOG.md — add a "## [X.Y.Z] - date" section (no leading `v`) first.'
      - sh: 'test -z "$(git tag --list "redistransport/$V")"'
        msg: 'Local tag redistransport/{{.V}} already exists. Use release:delete first.'
      - sh: |
          out=$(git ls-remote --tags "$REMOTE" "refs/tags/redistransport/$V" 2>&1) \
            || { echo "git ls-remote failed: $out" >&2; exit 1; }
          test -z "$out"
        msg: 'Remote tag redistransport/{{.V}} already exists on `{{.REMOTE | default "origin"}}` (run release:delete first), or the remote is unreachable.'
      # Accept either explicit `user.signingkey` or `commit.gpgsign=true`
      # (operators using the default GPG key via gpg-agent may not set
      # signingkey explicitly).
      - sh: 'test -n "$(git config --get user.signingkey)" || [ "$(git config --get commit.gpgsign)" = "true" ]'
        msg: 'No `user.signingkey` and `commit.gpgsign` is not true — `git tag -as` will fail. Load your signing key (`ssh-add` / `gpg --list-secret-keys`).'
      # gh auth is not used by `release:tag` itself, but the operator's
      # intent is to ship a release. Failing here saves a `release:delete`
      # recovery when `release:publish` would have failed minutes later
      # with auth-expired error after the tag was already signed.
      - sh: 'gh auth status >/dev/null 2>&1'
        msg: "gh CLI not authenticated. Run 'gh auth login' first — release:publish will need it after release:tag."
    cmds:
      - bash scripts/release.sh tag

  release:publish:
    desc: "Create the GitHub release from the pushed tag + spliced notes (V=v0.1.0 [REMOTE=origin])"
    requires:
      vars: [V]
    env:
      V: '{{.V}}'
      REMOTE: '{{.REMOTE | default "origin"}}'
    preconditions:
      - sh: '[[ "$REMOTE" =~ ^[A-Za-z][A-Za-z0-9._/-]*$ ]]'
        msg: 'REMOTE must be a simple git remote name (got: {{.REMOTE | default "origin"}})'
      - sh: '[[ "$V" =~ {{.TAG_VERSION_REGEX}} ]]'
        msg: 'V must be vX.Y.Z[-suffix] (got: {{.V}})'
      - sh: 'test "${V#v}" = "{{.RT_VERSION}}"'
        msg: 'V ({{.V}}) does not match RT_VERSION (v{{.RT_VERSION}}). Bump first via `task version:set:rt V=...`.'
      - sh: 'test -f redistransport/CHANGELOG.md'
        msg: 'redistransport/CHANGELOG.md not found.'
      - sh: 'awk -v v="$V" -v mode=check -f scripts/extract-changelog-section.awk redistransport/CHANGELOG.md'
        msg: 'No release notes section found for {{.V}} in redistransport/CHANGELOG.md — add a "## [X.Y.Z] - date" section first.'
      # Catch untracked AND uncommitted edits to either notes source — the
      # plain `git diff` form silently passes for untracked files, which
      # would publish a release body that exists only on the operator's
      # disk and can't be reproduced from any git state.
      - sh: 'test -z "$(git status --porcelain -- redistransport/CHANGELOG.md "redistransport/releases/$V.pre.md")"'
        msg: 'CHANGELOG.md or `redistransport/releases/{{.V}}.pre.md` has uncommitted/untracked changes — commit first so the published release matches a recorded git state.'
      - sh: 'gh auth status >/dev/null 2>&1'
        msg: "gh CLI not authenticated. Run 'gh auth login' first."
      # Tag must already exist on the remote — publish uses --verify-tag,
      # but checking here gives a clearer error than gh's "tag doesn't exist".
      - sh: |
          out=$(git ls-remote --tags "$REMOTE" "refs/tags/redistransport/$V" 2>&1) \
            || { echo "git ls-remote failed: $out" >&2; exit 1; }
          test -n "$out"
        msg: 'Remote tag redistransport/{{.V}} not found on `{{.REMOTE | default "origin"}}`. Run `task release:tag V={{.V}}` first.'
    cmds:
      - bash scripts/release.sh publish

  release:create:
    desc: "Release redistransport: tag + publish (V=v0.1.0 [REMOTE=origin])"
    requires:
      vars: [V]
    env:
      V: '{{.V}}'
      REMOTE: '{{.REMOTE | default "origin"}}'
    preconditions:
      - sh: '[[ "$REMOTE" =~ ^[A-Za-z][A-Za-z0-9._/-]*$ ]]'
        msg: 'REMOTE must be a simple git remote name (got: {{.REMOTE | default "origin"}})'
      - sh: '[[ "$V" =~ {{.TAG_VERSION_REGEX}} ]]'
        msg: 'V must be vX.Y.Z[-suffix] (got: {{.V}})'
      - sh: 'test "${V#v}" = "{{.RT_VERSION}}"'
        msg: 'V ({{.V}}) does not match RT_VERSION (v{{.RT_VERSION}}). Bump first via `task version:set:rt V=...`.'
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = "fork/main" ]'
        msg: 'Release must run from the fork/main branch.'
      - sh: 'test -z "$(git status --porcelain)"'
        msg: 'Working tree dirty. Commit or stash before releasing. Run `git status` to see dirty paths.'
      - sh: 'test -f redistransport/CHANGELOG.md'
        msg: 'redistransport/CHANGELOG.md not found.'
      - sh: 'awk -v v="$V" -v mode=check -f scripts/extract-changelog-section.awk redistransport/CHANGELOG.md'
        msg: 'No release notes section found for {{.V}} in redistransport/CHANGELOG.md — add a "## [X.Y.Z] - date" section first.'
      - sh: 'test -z "$(git tag --list "redistransport/$V")"'
        msg: 'Local tag redistransport/{{.V}} already exists. Use release:delete first.'
      - sh: |
          out=$(git ls-remote --tags "$REMOTE" "refs/tags/redistransport/$V" 2>&1) \
            || { echo "git ls-remote failed: $out" >&2; exit 1; }
          test -z "$out"
        msg: 'Remote tag redistransport/{{.V}} already exists on `{{.REMOTE | default "origin"}}` (run release:delete first), or the remote is unreachable.'
      - sh: 'gh auth status >/dev/null 2>&1'
        msg: "gh CLI not authenticated. Run 'gh auth login' first."
      - sh: 'test -n "$(git config --get user.signingkey)" || [ "$(git config --get commit.gpgsign)" = "true" ]'
        msg: 'No `user.signingkey` and `commit.gpgsign` is not true — `git tag -as` will fail. Load your signing key (`ssh-add` / `gpg --list-secret-keys`).'
    cmds:
      - bash scripts/release.sh create

  release:update:
    desc: "Re-splice redistransport release notes (prelude + CHANGELOG) and edit the GitHub release (V=v0.1.0 [REMOTE=origin])"
    requires:
      vars: [V]
    env:
      V: '{{.V}}'
      REMOTE: '{{.REMOTE | default "origin"}}'
    preconditions:
      - sh: '[[ "$REMOTE" =~ ^[A-Za-z][A-Za-z0-9._/-]*$ ]]'
        msg: 'REMOTE must be a simple git remote name (got: {{.REMOTE | default "origin"}})'
      - sh: '[[ "$V" =~ {{.TAG_VERSION_REGEX}} ]]'
        msg: 'V must be vX.Y.Z[-suffix] (got: {{.V}})'
      - sh: 'gh auth status >/dev/null 2>&1'
        msg: "gh CLI not authenticated. Run 'gh auth login' first."
      - sh: 'test -f redistransport/CHANGELOG.md'
        msg: 'redistransport/CHANGELOG.md not found.'
      - sh: 'awk -v v="$V" -v mode=check -f scripts/extract-changelog-section.awk redistransport/CHANGELOG.md'
        msg: 'No release notes section for {{.V}} in redistransport/CHANGELOG.md.'
      # Use the script's REPO-aware gh for the release-existence check —
      # the bare `gh release view` falls back to gh's default-repo heuristic
      # and on a fork with an `upstream` remote silently queries upstream.
      - sh: |
          # Strip .git first to avoid the in-regex (\.git)?$ alternative
          # matching .git as part of the captured name when `.` is in the
          # char class (legitimate for `org.io`-style repo names).
          url=$(git remote get-url "$REMOTE" 2>/dev/null)
          url=${url%.git}
          REPO=$(printf "%s" "$url" | sed -nE \
            -e 's#^git@github\.com:([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$#\1#p' \
            -e 's#^ssh://git@github\.com(:[0-9]+)?/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$#\2#p' \
            -e 's#^https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$#\1#p')
          [ -n "$REPO" ] || { echo "could not derive repo from $REMOTE" >&2; exit 1; }
          gh release view --repo "$REPO" "redistransport/$V" >/dev/null 2>&1
        msg: 'Release redistransport/{{.V}} does not exist on the fork. Use release:create first.'
      # Reject untracked as well as uncommitted notes edits (see release:publish).
      - sh: 'test -z "$(git status --porcelain -- redistransport/CHANGELOG.md "redistransport/releases/$V.pre.md")"'
        msg: 'CHANGELOG.md or `redistransport/releases/{{.V}}.pre.md` has uncommitted/untracked changes — commit first so the published release matches a recorded git state.'
    cmds:
      - bash scripts/release.sh update

  release:delete:
    desc: "Delete redistransport release + tag (V=v0.1.0 [REMOTE=origin])"
    requires:
      vars: [V]
    env:
      V: '{{.V}}'
      REMOTE: '{{.REMOTE | default "origin"}}'
    preconditions:
      - sh: '[[ "$REMOTE" =~ ^[A-Za-z][A-Za-z0-9._/-]*$ ]]'
        msg: 'REMOTE must be a simple git remote name (got: {{.REMOTE | default "origin"}})'
      - sh: '[[ "$V" =~ {{.TAG_VERSION_REGEX}} ]]'
        msg: 'V must be vX.Y.Z[-suffix] (got: {{.V}})'
      - sh: 'gh auth status >/dev/null 2>&1'
        msg: "gh CLI not authenticated. Run 'gh auth login' first."
      - sh: |
          # Strip .git first (see release:update).
          url=$(git remote get-url "$REMOTE" 2>/dev/null)
          url=${url%.git}
          REPO=$(printf "%s" "$url" | sed -nE \
            -e 's#^git@github\.com:([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$#\1#p' \
            -e 's#^ssh://git@github\.com(:[0-9]+)?/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$#\2#p' \
            -e 's#^https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$#\1#p')
          [ -n "$REPO" ] || { echo "could not derive repo from $REMOTE" >&2; exit 1; }
          gh release view --repo "$REPO" "redistransport/$V" >/dev/null 2>&1 && exit 0
          git rev-parse "refs/tags/redistransport/$V" >/dev/null 2>&1 && exit 0
          out=$(git ls-remote --tags "$REMOTE" "refs/tags/redistransport/$V" 2>&1) || { echo "git ls-remote failed: $out" >&2; exit 1; }
          test -n "$out"
        msg: 'No release, local tag, or remote tag redistransport/{{.V}} found — nothing to delete.'
      - sh: 'gh release delete --help 2>&1 | grep -q -- "--cleanup-tag"'
        msg: 'gh CLI 2.46+ required.'
    cmds:
      - bash scripts/release.sh delete

  # ============================================
  # Info
  # ============================================
  info:
    desc: Show service + upstream + transport versions and key URLs
    cmds:
      - |
        printf "Service:   %s %s\nUpstream:  mercure %s\nTransport: redistransport %s\nImage:     %s\n\nURLs:\n  Debug UI (HTTPS): %s\n  Debug UI (HTTP):  %s\n  Metrics:          %s\n  Prometheus:       %s\n  Grafana:          %s\n  RedisInsight:     %s\n" \
          "{{.SVC_NAME}}" "{{.SVC_VERSION}}" "{{.UPSTREAM_VERSION}}" "{{.RT_VERSION}}" "{{.SVC_IMAGE}}" \
          "{{.MERCURE_UI}}" "{{.MERCURE_HTTP_UI}}" "{{.METRICS_URL}}" "{{.PROMETHEUS_URL}}" "{{.GRAFANA_URL}}" "{{.REDISINSIGHT_URL}}"
