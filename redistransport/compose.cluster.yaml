# Docker Compose for running Redis Cluster integration tests.
#
# Layout: a single container runs three redis-server processes — each
# listening on a plain port (7000-7002) AND a TLS port (8000-8002). The
# plain ports are used by the default cluster integration tests; the TLS
# ports are exercised by the TLS-on-Cluster test. Both planes share the
# same cluster topology (one bootstrap, one set of slots).
#
# Why single-container: with `--cluster-announce-ip 127.0.0.1` the nodes
# share the container's loopback so cluster-bus gossip routes correctly,
# and the announce IP is host-routable through the published port
# mappings. A multi-container bridge-network setup would need a custom
# client Dialer to rewrite container hostnames on every connection — that
# hack is what testcontainers-go does, and it's fragile.
#
# Cluster bus stays plain (no `--tls-cluster yes`) — the bus is internal
# Redis behavior, not part of this transport's surface. Client→server
# TLS is what proves the rediss:// / `tls`+`tls_insecure_skip_verify`
# directive path works against a real cluster.
#
# TLS material is generated by `task cluster:certs:gen` (cluster:up's
# dependency) into `.tmp/cluster-certs/` and mounted into the container
# read-only. A single self-signed cert (CN=mercure-test,
# SAN=IP:127.0.0.1) serves as both the server cert and CA cert —
# adequate for tests that connect with `tls_insecure_skip_verify=true`,
# the recommended production pattern for clusters with non-shared
# per-node SANs.
#
# Bus ports (17000-17002) intentionally NOT published — gossip is intra-
# container. Clients only reach the data and TLS ports.

name: mercure-redis-cluster

services:
  redis-cluster:
    container_name: mercure-redis-cluster
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
      - "127.0.0.1:7001:7001"
      - "127.0.0.1:7002:7002"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    volumes:
      # Self-signed test certs generated by `task cluster:certs:gen` (the
      # cluster:up dependency). Mounted read-only; gitignored under
      # .tmp/ so committing crypto material to the repo isn't possible.
      - "./.tmp/cluster-certs:/tls:ro"
    command:
      - sh
      - -c
      - |
        set -e
        cd /tmp

        for port in 7000 7001 7002; do
          tls_port=$$((port + 1000))
          redis-server \
            --port $$port \
            --tls-port $$tls_port \
            --tls-cert-file /tls/server.crt \
            --tls-key-file /tls/server.key \
            --tls-ca-cert-file /tls/server.crt \
            --tls-auth-clients no \
            --cluster-enabled yes \
            --cluster-config-file /tmp/nodes-$$port.conf \
            --cluster-node-timeout 5000 \
            --cluster-announce-ip 127.0.0.1 \
            --appendonly no \
            --save "" \
            --maxmemory 64mb \
            --maxmemory-policy allkeys-lru \
            --logfile "" \
            &
        done
        until redis-cli -p 7000 ping > /dev/null 2>&1 \
           && redis-cli -p 7001 ping > /dev/null 2>&1 \
           && redis-cli -p 7002 ping > /dev/null 2>&1; do
          sleep 0.2
        done
        redis-cli --cluster create \
          127.0.0.1:7000 \
          127.0.0.1:7001 \
          127.0.0.1:7002 \
          --cluster-yes
        wait
    healthcheck:
      test:
        - "CMD-SHELL"
        - "redis-cli -p 7000 cluster info | grep -q '^cluster_state:ok'"
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 15s
