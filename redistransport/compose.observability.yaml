# Shared Prometheus + Grafana stack for the redistransport dev loop.
#
# Included by compose.redis.yaml and compose.valkey.yaml. Gated behind
# the `metrics` profile so the lightweight default `up -d` doesn't pull
# the prom/grafana images for ad-hoc iteration.
#
# Usage:
#   docker compose -f compose.redis.yaml --profile metrics up -d
#   docker compose -f compose.valkey.yaml --profile metrics up -d
#
# Then:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000   (anonymous editor; admin/admin)
#
# Scrape target: the Mercure hub running natively on the host via
# `task redis:run`, exposed at host.docker.internal:9091. The hub must
# already be running for Prometheus to have anything to scrape — this
# stack provides observability infrastructure, not the hub itself.
#
# Mutual exclusion with root compose.yaml:
#   - Container names `prometheus`, `grafana`, `jaeger` would conflict
#     with the root compose stack (container_name is daemon-global). Run
#     one or the other, not both at once.
#   - Ports 9090 (Prometheus), 3000 (Grafana) and 16686 / 4317 / 4318
#     (Jaeger UI + OTLP) likewise.

services:
  prometheus:
    profiles: ["metrics"]
    container_name: prometheus
    image: ${PROMETHEUS_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # Linux fallback — Docker Desktop / OrbStack already provide this
      # alias; on bare Linux this maps to the host bridge gateway.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    profiles: ["metrics"]
    container_name: grafana
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # Anonymous Viewer (Editor deprecated in Grafana 12.x) — see root
      # compose.observability.yaml. Sign in as admin/admin to edit.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Disable the public-plugin-registry poll — see root compose.observability.yaml.
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      # Silence the upstream-stats reporter — see root compose.observability.yaml.
      - GF_ANALYTICS_REPORTING_ENABLED=false
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards/transport.json:/etc/grafana/dashboards/transport.json:ro
      # Separate trace dashboard (Jaeger datasource). Mounted always, but its
      # panels only have data under `task dev:full:tracing` (when the Jaeger
      # sidecar runs); it deliberately stays OFF the always-on transport.json so
      # the metrics dashboard never shows dead trace panels. See its description.
      - ./grafana/dashboards/transport-tracing.json:/etc/grafana/dashboards/transport-tracing.json:ro
      # Cross-tree mount: the hub binary running natively against this Redis stack
      # emits both mercure_redis_* and hub-level (mercure_*, go_*, process_*, caddy_*)
      # metrics from the same /metrics endpoint, so this stack provisions both
      # dashboards. hub.json's source of truth lives in the parent tree.
      - ../grafana/dashboards/hub.json:/etc/grafana/dashboards/hub.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  # Redis-server-side metrics complement to mercure_redis_* — distinguishes
  # "hub is slow" from "Redis is slow" (memory pressure, evictions, slow
  # log, command throughput, connected clients).
  #
  # Default REDIS_ADDR points at the host bridge so a single sidecar
  # definition serves both compose.redis.yaml (service `redis`) and
  # compose.valkey.yaml (service `valkey`) — direct service-name resolution
  # would require per-stack overrides since the backend service name
  # differs between the two compose files.
  #
  # Bare-Linux note: the dev compose stacks publish 6379 only on host
  # loopback (`127.0.0.1:6379:6379`). Docker Desktop / OrbStack proxy
  # `host.docker.internal` traffic to the host's loopback, so this works.
  # On a bare-Linux Docker Engine host, `host.docker.internal` resolves to
  # the bridge gateway and a process bound to 127.0.0.1 will not accept
  # those packets. Override with the per-stack service name when running
  # under bare Linux — note the env var must be exported into the
  # `docker compose` process (inline-prefix or `export`, not a Task
  # `--var=` CLI arg, which only feeds Task's own templating):
  #
  #   REDIS_EXPORTER_ADDR=redis://redis:6379  task rt:metrics:up:redis
  #   REDIS_EXPORTER_ADDR=redis://valkey:6379 task rt:metrics:up:valkey
  #
  # The exporter is pinned because the dashboard panels in
  # `grafana/dashboards/transport.json` query specific metric series (e.g.
  # `redis_commands_processed_total`, `redis_commands_duration_seconds_total`
  # with `cmd` label) that the upstream exporter has historically renamed
  # across major releases.
  redis_exporter:
    profiles: ["metrics"]
    container_name: redis_exporter
    image: ${REDIS_EXPORTER_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9121:9121"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_ADDR=${REDIS_EXPORTER_ADDR:-redis://host.docker.internal:6379}
      # Suppress the once-only "LATENCY HISTOGRAM err: ..." warning on Redis
      # variants that don't support the command (Valkey, older Redis without
      # latency monitoring). LATENCY LATEST also warns once but has no flag —
      # accepted as expected, bounded noise. The flag was introduced in
      # oliver006/redis_exporter v1.60.0 (PR #913, May 2024) and is honored
      # by the v1.83.0-alpine pin above; re-validate when bumping the image.
      - REDIS_EXPORTER_EXCLUDE_LATENCY_HISTOGRAM_METRICS=true
    # The `-alpine` image variant ships busybox so the wget-based
    # healthcheck below works. The default scratch-based tag (`v1.83.0`)
    # has no shell — would require dropping the Docker healthcheck and
    # relying solely on Prometheus's `up{job="redis"}` scrape signal.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Trace backend for `task dev:full:tracing` (tracing profile, opt-in). Lives
  # in this stack — rather than borrowing the root compose.observability.yaml
  # jaeger — so it shares the Redis stack's default network with Grafana; the
  # Grafana Jaeger datasource resolves `jaeger` only when they're co-networked.
  # The hub→Jaeger OTLP path uses the published host ports (4317/4318), so
  # collection works regardless; co-networking is what the Grafana trace
  # dashboard's datasource query needs.
  jaeger:
    profiles: ["tracing"]
    container_name: jaeger
    image: ${JAEGER_IMAGE}
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"  # web UI — http://localhost:16686
      - "127.0.0.1:4317:4317"    # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver
    healthcheck:
      # 14269 is Jaeger all-in-one's admin/health port (not 16686 the UI, not
      # 4317/4318 OTLP). If you swap to jaeger-v2 / a split collector image,
      # this port changes.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 30s — see root compose.observability.yaml for rationale (kept in
      # lock-step with the root jaeger block; bump both together).
      start_period: 30s

volumes:
  prometheus_data:
  grafana_data:
