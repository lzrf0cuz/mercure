apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "5s"

  # Jaeger: reachable only under the tracing profile (`task dev:full:tracing`); used by transport-tracing.json.
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    jsonData:
      # Link spans to the transport metrics.
      tracesToMetrics:
        datasourceUid: prometheus
