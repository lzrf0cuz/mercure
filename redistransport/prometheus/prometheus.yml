global:
  scrape_interval: 5s

scrape_configs:
  # The redistransport dev loop runs the hub natively (`task dev:redis` or
  # `task go:run:redis` from the repo root), so Prometheus scrapes the host
  # through Docker's host bridge alias.
  #
  # `host.docker.internal` resolves on Docker Desktop (macOS and Windows),
  # OrbStack and Rancher Desktop. On bare Linux the prometheus service in
  # compose.observability.yaml maps it to the host gateway through
  # `extra_hosts`.
  - job_name: mercure
    static_configs:
      - targets: ['host.docker.internal:9091']

  # Redis-server-side metrics via oliver006/redis_exporter, gated behind
  # the `metrics` Compose profile. Prometheus reaches `redis_exporter` on the
  # project's default network; by default the exporter connects to Redis or
  # Valkey on `host.docker.internal:6379`.
  - job_name: redis
    static_configs:
      - targets: ['redis_exporter:9121']
