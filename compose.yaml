name: compose

# Compose `include:` directive merges services + volumes from the listed
# files into this project. Symmetric with redistransport/compose.*.yaml's
# segregation. Root-side observability is always-on (no profile gating)
# because the hub dev loop expects metrics + dashboards by default; see
# compose.observability.yaml's header for the rationale and mutual
# exclusion notes against the transport-side observability stack.
include:
  - compose.observability.yaml

services:
  mercure:
    container_name: mercure
    # Required, not defaulted: the Taskfile `env:` exports SVC_IMAGE + the version
    # vars for every task, so `:?` only bites a bare `docker compose` — fail loud
    # instead of an `image: :` error or a silently mislabeled-version build.
    image: ${SVC_IMAGE:?run via the Taskfile — bare docker compose is unsupported}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_IMAGE: ${SVC_BUILD_IMAGE:?run via the Taskfile — bare docker compose is unsupported}
        BASE_IMAGE: ${SVC_BASE_IMAGE:?run via the Taskfile — bare docker compose is unsupported}
        SVC_VERSION: ${SVC_VERSION:?run via the Taskfile — bare docker compose is unsupported}
        UPSTREAM_VERSION: ${UPSTREAM_VERSION:?run via the Taskfile — bare docker compose is unsupported}
        RT_VERSION: ${RT_VERSION:?run via the Taskfile — bare docker compose is unsupported}
    platform: ${PLATFORM}
    # Default env file is .env.dev (HS256 demo secret, dev-permissive). For
    # production deploys: copy .env.prod.template → .env.prod, fill in
    # SERVER_NAME, JWT keys, and cors_origins / publish_origins under
    # MERCURE_EXTRA_DIRECTIVES; then run `ENV_FILE=.env.prod task up
    # CADDYFILE=Caddyfile`. Reverse-proxy / load-balancer fronted deploys layer
    # their own compose + Caddyfiles on this image downstream.
    # .env.prod is gitignored; .env.prod.template is the committed scaffold.
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      # OTLP exporter pointed at the profile-gated jaeger service (see
      # compose.observability.yaml). When the `tracing` profile isn't up,
      # Caddy's OTLP exporter retries with backoff and the hub continues
      # normally; effective only when the Caddyfile enables `tracing`.
      #
      # Operator footgun: enabling `tracing` in the Caddyfile WITHOUT also
      # running `task tracing:up` (which starts the profile-gated jaeger
      # service) makes the OTLP exporter log DNS-resolution failures on
      # every export attempt — `jaeger:4317` does not resolve. To enable
      # tracing, do both: edit the Caddyfile AND run `task tracing:up`.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: mercure-hub
    # === JWT Algorithm Override ===
    # Default: HS256 (from .env.dev). No override needed.
    #
    # To use RS256 with PEM key, uncomment the environment block below.
    # This overrides the HS256 key/alg from .env.dev with PEM + RS256.
    # All Caddyfiles use {env.VAR} for JWT key/alg, so multi-line PEM works.
    #
    # The PEM is duplicated inline below (as a YAML | block scalar, which
    # supports multi-line values) because the service `env_file:` reference
    # is line-oriented (KEY=VAL) — multi-line PEMs can't pass through
    # .env.dev to the container. Mounting the .key.pub file as a volume +
    # reading it via Caddyfile would also work but adds a second layer of
    # indirection. PEM source: fixtures/jwt/RS256.key.pub — see
    # public/fixtures/README.md "Rotation" for the full list of files to
    # keep in sync if the key rotates.
    #
    # environment:
    #   MERCURE_PUBLISHER_JWT_KEY: |
    #     -----BEGIN PUBLIC KEY-----
    #     MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA4UYxjmarfpasY6XdjQ7O
    #     QoRsv3+KarwbmO2JgIl4tYYfFVEuogfCjB26NOMjcn0VNKS1wFaSMCGgi6qgWsjF
    #     Sx2aM76PUgHNMaCzd8i2wwvarWM1QNiLdn29leBhaAjku0M1aQaQbPabNomUhceX
    #     ZdmqxjZ/Za/G+HGGp0taIV4yYw7dm2EsX5HWVYBMEx94OF/5O1lpkRyK18flr65i
    #     92+gOCNOIcojXkZ66aaaHK5Oel2kcIm8hfb0iK6j9sIk+FhMt5xc5Eaks7izhK4j
    #     Tu8m9ephF6sGYmXfcdsN34Te1FSRdiLb06Hes0mtAiQ57WEkxzTe0Q7osgqrP+3C
    #     M5Ew2ACs4tWCLW2075HJDJPtJx+LdP00R9cNE9wn+r4++ZUmeJdWyWW1eCosUhMG
    #     z5MusHEWTMYutCsnPsDDwJyBWPXCb3uV97v2O6fSbKqL1VdeGaMVsrHiBD447niR
    #     W0R4or1kO1oiHDDqzI0vKnUZ+XtnOUVnsnQzTkuoOwe6Q4Y+/GGd0LsRxqIIM7Rg
    #     Ohl4KI1lcv2xahPDKPyG01pGROo2b763bwh5jUmmp08QtNH5f4wR4nnnTdVzaJS4
    #     /dBScvsxwIoZdixizVJB3Focrbea7DPDWWjo17r7NTRPAIxO90u/rlrQ4+HN/9oz
    #     c+aKYAOhduDsfeDqj6R6M10CAwEAAQ==
    #     -----END PUBLIC KEY-----
    #   MERCURE_PUBLISHER_JWT_ALG: RS256
    #   MERCURE_SUBSCRIBER_JWT_KEY: |
    #     -----BEGIN PUBLIC KEY-----
    #     MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA4UYxjmarfpasY6XdjQ7O
    #     QoRsv3+KarwbmO2JgIl4tYYfFVEuogfCjB26NOMjcn0VNKS1wFaSMCGgi6qgWsjF
    #     Sx2aM76PUgHNMaCzd8i2wwvarWM1QNiLdn29leBhaAjku0M1aQaQbPabNomUhceX
    #     ZdmqxjZ/Za/G+HGGp0taIV4yYw7dm2EsX5HWVYBMEx94OF/5O1lpkRyK18flr65i
    #     92+gOCNOIcojXkZ66aaaHK5Oel2kcIm8hfb0iK6j9sIk+FhMt5xc5Eaks7izhK4j
    #     Tu8m9ephF6sGYmXfcdsN34Te1FSRdiLb06Hes0mtAiQ57WEkxzTe0Q7osgqrP+3C
    #     M5Ew2ACs4tWCLW2075HJDJPtJx+LdP00R9cNE9wn+r4++ZUmeJdWyWW1eCosUhMG
    #     z5MusHEWTMYutCsnPsDDwJyBWPXCb3uV97v2O6fSbKqL1VdeGaMVsrHiBD447niR
    #     W0R4or1kO1oiHDDqzI0vKnUZ+XtnOUVnsnQzTkuoOwe6Q4Y+/GGd0LsRxqIIM7Rg
    #     Ohl4KI1lcv2xahPDKPyG01pGROo2b763bwh5jUmmp08QtNH5f4wR4nnnTdVzaJS4
    #     /dBScvsxwIoZdixizVJB3Focrbea7DPDWWjo17r7NTRPAIxO90u/rlrQ4+HN/9oz
    #     c+aKYAOhduDsfeDqj6R6M10CAwEAAQ==
    #     -----END PUBLIC KEY-----
    #   MERCURE_SUBSCRIBER_JWT_ALG: RS256
    command: mercure run -w -c /etc/caddy/${CADDYFILE:-local.Caddyfile}
    healthcheck:
      # Transport-aware health via the Caddy admin API (127.0.0.1:2019).
      # Admin API is localhost-only inside the container and serves
      # /mercure/health/ready via the mercure_health admin module.
      # Uses 127.0.0.1 explicitly because `admin localhost:2019` binds IPv4
      # loopback only, and Alpine's `localhost` prefers IPv6 (::1) → refused.
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/mercure/health/ready" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "80:80"       # HTTP redirect (local.Caddyfile and Caddyfile)
      - "443:443"     # HTTPS (local.Caddyfile and Caddyfile)
      # Admin API host-bind for dev convenience (curl from host). Bound to
      # 127.0.0.1 only — never the LAN. The HEALTHCHECK does not depend on
      # this publish; it runs inside the container and reaches admin via
      # the container's loopback. In production deployments admin must
      # NEVER be exposed as a published port — the origin allow-list
      # is loopback-only, but binding wide creates a misleading exposure
      # surface. Host-loopback in local dev is fine.
      - "127.0.0.1:2019:2019"
      - "9091:9091"   # Metrics endpoint
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local.Caddyfile:/etc/caddy/local.Caddyfile:ro
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mercure_data:
  mercure_config:
