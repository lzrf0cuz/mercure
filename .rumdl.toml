[global]
disable = ["MD029", "MD036", "MD033", "MD004", "MD013", "MD060"]
# examples README is auto-generated by helm-docs — modifying breaks the next
# regen. redistransport/releases/*.md are GitHub release-note bodies (fed to
# `gh release create --notes-file`); the release title is the heading there, so
# MD041's "first line must be an H1" does not apply to these fragments.
exclude = [
    "examples/chat/chart/mercure-example-chat/README.md",
    "redistransport/releases/*.md",
]

[per-file-ignores]
# Upstream content — a blank line separates two loosely-related groups of
# find-and-replace items within the same list; not a formatting mistake to
# fix, and this file isn't ours to edit.
"docs/UPGRADE.md" = ["MD076"]

[MD025]
# Upstream docs/**/*.md carry a front-matter `title:` field (site metadata)
# in addition to their own in-body `# H1`. rumdl's default
# (front-matter-title = "title") counts that field as the document's H1,
# so it collides with the real one. Disabling the front-matter lookup
# keeps MD025 checking actual in-body headings only — it still fails a
# document with two real H1s.
front-matter-title = ""

[MD007]
indent = 2
style = "fixed"

[MD026]
punctuation = ".,;:!。，；:"
