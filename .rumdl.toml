[global]
disable = ["MD029", "MD036", "MD033", "MD004", "MD013", "MD060"]
# examples README is auto-generated by helm-docs — modifying breaks the next
# regen. redistransport/releases/*.md are GitHub release-note bodies (fed to
# `gh release create --notes-file`); the release title is the heading there, so
# MD041's "first line must be an H1" does not apply to these fragments.
exclude = [
    "examples/chat/chart/mercure-example-chat/README.md",
    "redistransport/releases/*.md",
]

[MD007]
indent = 2
style = "fixed"

[MD026]
punctuation = ".,;:!。，；:"
